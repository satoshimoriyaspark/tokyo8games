<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#25b9d0">
<title>CONTACT | TOKYO 8 GAMES</title>
<meta name="description" content="TOKYO 8 GAMESへのお問い合わせ">
<link rel="stylesheet" href="/style.css">
</head>
<body class="contact-page">
<header>
  <a class="brand" href="/">TOKYO <b>8</b> GAMES</a>
  <a class="contact-back" href="/">← BACK</a>
</header>
<main>
<section class="contact-hero">
  <p class="eyebrow">CONTACT</p>
  <h1>お問い合わせ</h1>
  <p>ゲーム、イベント、取材、コラボレーションなど、お気軽にご連絡ください。</p>
</section>

<section class="contact-wrap">
  <form class="contact-form" action="https://formsubmit.co/satoshimoriya@gmail.com" method="POST">
    <input type="hidden" name="_subject" value="【TOKYO 8 GAMES】Webサイトからのお問い合わせ">
    <input type="hidden" name="_next" value="https://tokyo8games.com/thanks.html">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_url" value="https://tokyo8games.com/contact.html">
    <input type="text" name="_honey" class="honey" tabindex="-1" autocomplete="off">

    <label>
      <span>お名前 <b>必須</b></span>
      <input type="text" name="お名前" required maxlength="80" autocomplete="name">
    </label>

    <label>
      <span>メールアドレス <b>必須</b></span>
      <input type="email" name="email" required maxlength="160" autocomplete="email">
    </label>

    <label>
      <span>お問い合わせ種別 <b>必須</b></span>
      <select name="お問い合わせ種別" required>
        <option value="">選択してください</option>
        <option>ゲームについて</option>
        <option>イベント・ワークショップ</option>
        <option>取材・メディア</option>
        <option>コラボ・仕事のご相談</option>
        <option>その他</option>
      </select>
    </label>

    <label>
      <span>件名 <b>必須</b></span>
      <input type="text" name="件名" required maxlength="120">
    </label>

    <label>
      <span>お問い合わせ内容 <b>必須</b></span>
      <textarea name="お問い合わせ内容" rows="8" required maxlength="3000"></textarea>
    </label>

    <label class="consent">
      <input type="checkbox" required>
      <span>入力内容を確認し、返信のために送信することに同意します。</span>
    </label>

    <button class="contact-submit" type="submit">MESSAGE SEND ▶</button>
  </form>
  <p class="contact-note">送信内容はお問い合わせへの返信・対応のために利用します。</p>
</section>
</main>
<footer>
  <b>TOKYO 8 GAMES</b>
  <span>PLAY JAPAN. PLAY THE WORLD.</span>
  <small>© 2026 TOKYO 8 GAMES</small>
</footer>
</body>
</html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>カツコレ！アリィのスクーターRUN｜亀有β</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#101b30;color:#fff;font-family:monospace}body{display:grid;place-items:center;min-height:100dvh}main{width:min(100%,960px);padding:10px}h1{font-size:clamp(15px,3vw,24px);margin:8px 0 12px}canvas{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;display:block;width:100%;aspect-ratio:16/9;image-rendering:pixelated;border:4px solid #f7dc83;touch-action:none;background:#9ddcf1}.bar{display:flex;justify-content:space-between;gap:8px;margin:12px 0}.bar button{touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;flex:1;background:#ffdd64;color:#15213a;border:3px solid #fff;border-radius:0;padding:12px 4px;font:bold 15px monospace;cursor:pointer}p{font-size:12px;line-height:1.7;color:#dce4f5;margin:6px 0}.note{color:#ffdd64}@media (orientation:landscape) and (max-height:650px){
 html,body{width:100%;height:100%;overflow:hidden}
 body{display:block;min-height:0}
 main{position:fixed;inset:0;width:100%;max-width:none;height:100dvh;padding:0;display:flex;align-items:center;justify-content:center;background:#101b30;overflow:hidden}
 h1,main>p{display:none}
 canvas{width:min(100vw,calc(100dvh * 16 / 9));height:min(100dvh,calc(100vw * 9 / 16));max-width:100%;max-height:100%;border:0;flex:0 0 auto}
 .bar{position:absolute;inset:auto max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));margin:0;display:flex;justify-content:flex-end;gap:5px;pointer-events:none}
 .bar button{flex:0 0 auto;pointer-events:auto;opacity:.72;font-size:10px;padding:5px 7px;border:1px solid #fff;background:#ffdc5e}
 .bar #action{margin-right:auto}
}
#fullscreen{background:#7de4ca}
</style></head><body><main><h1>カツコレ！ アリィのスクーターRUN <small>亀有 β</small></h1><canvas id="game" width="320" height="180" aria-label="亀有商店街を走る横スクロールゲーム"></canvas><div class="bar"><button id="action">START / NEXT</button><button id="jump">JUMP</button><button id="slide">SLIDE</button><button id="pause">PAUSE</button><button id="fullscreen">FULL</button></div><p>六角形の？チップ（ハテナチップ）を集めよう。タップ / Space：ジャンプ（二段まで）　下スワイプ / ↓：スライド　Esc：一時停止。<span class="note">キャラクターは正式アリィではない仮スプライトです。</span></p></main><script>
'use strict';const c=document.querySelector('#game'),g=c.getContext('2d');g.imageSmoothingEnabled=false;
const $=s=>document.querySelector(s);let state='intro',tick=0,score=0,coins=0,clues=0,hits=0,scroll=0,paused=false,items=[],p={y:113,vy:0,j:0,slide:0},last=0,acc=0;
const T=()=>Math.floor(tick/60),DURATION=115,ground=138;
function reset(){state='play';tick=0;score=0;coins=0;clues=0;hits=0;scroll=0;items=[];paused=false;p={y:113,vy:0,j:0,slide:0};last=0;acc=0}
function next(){if(state==='intro'||state==='fail'||state==='result')reset();else if(state==='story')state='result';else if(state==='play')jump()}
function jump(){if(state!=='play'||paused)return;if(p.j<2){p.vy=-5.3;p.j++;p.slide=0}}
function slide(){if(state==='play'&&!paused&&p.y>=113)p.slide=36}
$('#fullscreen').onclick=async()=>{
 const root=document.querySelector('main');
 try{
  if(document.fullscreenElement){await document.exitFullscreen()}
  else if(root.requestFullscreen){await root.requestFullscreen({navigationUI:'hide'})}
  else{$('#fullscreen').textContent='横画面で表示'}
 }catch(_){$('#fullscreen').textContent='横画面で表示'}
};
document.addEventListener('fullscreenchange',()=>{
 $('#fullscreen').textContent=document.fullscreenElement?'EXIT':'FULL';
});
$('#action').onclick=next;$('#jump').onclick=()=>state==='intro'?next():jump();$('#slide').onclick=slide;$('#pause').onclick=()=>{if(state==='play')paused=!paused};
let touchY=0,touchX=0,pointerStart=null;
c.addEventListener('contextmenu',e=>e.preventDefault());
c.addEventListener('dragstart',e=>e.preventDefault());
c.addEventListener('pointerdown',e=>{
 if(e.pointerType==='mouse'&&e.button!==0)return;
 touchY=e.clientY;touchX=e.clientX;pointerStart=e.pointerId;
 try{c.setPointerCapture(e.pointerId)}catch(_){}
});
c.addEventListener('pointercancel',()=>{pointerStart=null});
c.addEventListener('pointerup',e=>{
 if(pointerStart!==e.pointerId)return;
 pointerStart=null;
 const dy=e.clientY-touchY,dx=e.clientX-touchX;
 if(dy>25&&Math.abs(dy)>Math.abs(dx)*1.1)slide();
 else if(Math.abs(dx)<45&&dy>-35){if(state==='play')jump();else next()}
});document.addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','Escape','Enter'].includes(e.code))e.preventDefault();if(e.repeat)return;if(e.code==='Space'||e.code==='ArrowUp')state==='intro'?next():jump();if(e.code==='ArrowDown')slide();if(e.code==='Escape'&&state==='play')paused=!paused;if(e.code==='Enter'&&state!=='play')next()});
function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),w,h)}function txt(s,x,y,size=9,col='#fff'){g.font='bold '+size+'px monospace';g.fillStyle=col;g.fillText(s,x,y)}function box(x,y,w,h){rect(x,y,w,h,'#172a46');rect(x,y,w,2,'#ffdd64');rect(x,y+h-2,w,2,'#ffdd64')}
function building(x,i,layer){const w=44+(i%3)*8,y=46+(i%3)*9;rect(x,y,w,ground-y,['#dba38d','#b7c4bc','#e8c99e','#aeb8d5'][i%4]);rect(x-2,y-3,w+4,4,'#5c6579');rect(x+5,y+14,w-10,12,'#f9e5b6');rect(x+8,y+32,11,17,'#6e9cad');rect(x+25,y+32,12,17,'#6e9cad');rect(x+2,ground-21,w-4,4,['#b55c6c','#638d9a'][i%2]);if(layer===0){rect(x+4,ground-16,w-8,12,'#e7c9a0');rect(x+7,ground-14,14,9,'#719b9d')}}
function background(){rect(0,0,320,180,'#9bd8ed');rect(0,55,320,85,'#d6e9cf');rect(0,27,320,8,'#c4e4ec');for(let i=0;i<8;i++){const x=((i*65-scroll*.25)%460+460)%460-65;rect(x,54+(i%3)*7,45,84,'#9db6ae')}for(let i=0;i<9;i++){const x=((i*54-scroll*.55)%486+486)%486-54;building(x,i,0)}rect(0,138,320,42,'#6e7886');rect(0,136,320,3,'#ead9b4');for(let i=0;i<10;i++){let x=((i*42-scroll*1.8)%420+420)%420;rect(x,161,19,2,'#eee3bb')}}
function avatar(){let x=50,y=p.y,sl=p.slide>0;rect(x+2,y-23,14,12,'#423951');rect(x+4,y-20,10,10,'#f4c8a4');rect(x+2,y-10,14,sl?11:17,'#e7687b');rect(x+5,y+(sl?0:7),4,sl?6:8,'#364f76');rect(x+12,y+(sl?0:7),4,sl?6:8,'#364f76');rect(x-3,y+19,36,3,'#304b5f');rect(x-1,y+22,7,6,'#1b2b3c');rect(x+27,y+22,7,6,'#1b2b3c');rect(x+28,y-4,3,22,'#304b5f')}
function spawn(){if(tick%39===0)items.push({x:328,y:95+(tick%3)*8,k:'coin',done:false});if(tick%165===70)items.push({x:328,y:112,k:'clue',done:false});if(tick%115===0)items.push({x:328,y:126,k:'cone',done:false})}
function update(){tick++;scroll+=2.25;p.vy+=.29;p.y+=p.vy;if(p.y>=113){p.y=113;p.vy=0;p.j=0}if(p.slide>0)p.slide--;spawn();for(const o of items){o.x-=2.25;if(o.done)continue;const near=o.x>=43&&o.x<=69;if(!near)continue;if(o.k==='coin'&&Math.abs(o.y-(p.y-8))<28){o.done=true;coins++;score+=10}else if(o.k==='clue'&&Math.abs(o.y-(p.y-7))<31){o.done=true;clues++;score+=500}else if(o.k==='cone'&&p.y>103){o.done=true;hits++;score=Math.max(0,score-500);if(hits>=3)state='fail'}}items=items.filter(o=>o.x>-20&&!o.done);if(tick>=DURATION*60){score+=5000+(hits===0?3000:0)+clues*100;state='story'}}
function hexChip(x,y){
 // 12x12 pixel-grid hexagon: dark rim, gold edge, light face and centered question mark.
 const rows=['....####....','..########..','.##########.','############','############','############','############','############','.##########.','..########..','....####....'];
 for(let j=0;j<12;j++)for(let i=0;i<12;i++)if(rows[j][i]==='#'){
  let color='#9c611c';
  if(j>=1&&j<=10&&i>=2&&i<=9)color='#e6a42a';
  if(j>=3&&j<=8&&i>=3&&i<=8)color='#f9d768';
  rect(x+i,y+j,1,1,color);
 }
 // Question mark rendered as pixel blocks, not antialiased browser text.
 const q=['.###.','##.##','...##','..##.','..#..','.....','..#..'];
 for(let j=0;j<q.length;j++)for(let i=0;i<5;i++)if(q[j][i]==='#')rect(x+4+i,y+2+j,1,1,'#64431e');
}
function drawItems(){for(const o of items){if(o.k==='coin'){hexChip(o.x,o.y)}else if(o.k==='clue'){rect(o.x,o.y,13,12,'#4d99b8');rect(o.x+2,o.y+2,9,8,'#f7df8b');txt('?',o.x+4,o.y+9,8,'#344e7c')}else{rect(o.x+3,o.y,8,13,'#f07845');rect(o.x+1,o.y+11,12,3,'#fff3dc')}}}
function overlay(title,lines){box(19,49,282,85);txt(title,31,67,13,'#ffe18b');lines.forEach((s,i)=>txt(s,31,86+i*13,9))}
function render(){background();drawItems();avatar();rect(0,0,320,24,'#172a46');txt('?CHIP '+coins+'  MEMO '+clues+'  HIT '+hits+'/3',6,10,8);txt('SCORE '+score+'   '+Math.min(T(),DURATION)+'/'+DURATION+'s',6,20,8);
if(state==='intro')overlay('KAMEARI / 01',['アリィの取材がはじまる！','街の「？」を集めよう。','STARTで走行開始']);
if(state==='story')overlay('取材完了！',['取材メモを '+clues+' 個発見。','アリィ「次の取材へ行こう！」','タップでリザルトへ']);
if(state==='result')overlay('STAGE CLEAR',['SCORE '+score+'   ?CHIP '+coins,'MEMO '+clues+'  / 取材の記録','STARTで再挑戦']);
if(state==='fail')overlay('GAME OVER',['障害物に3回接触しました。','SCORE '+score+'  ?CHIP '+coins,'STARTで再挑戦']);
if(paused&&state==='play')overlay('PAUSE',['一時停止中','PAUSE / Escで再開'])}
function loop(now){requestAnimationFrame(loop);if(!last)last=now;let delta=Math.min(80,now-last);last=now;if(state==='play'&&!paused){acc+=delta;let n=0;while(acc>=1000/60&&n++<5){update();acc-=1000/60}}else acc=0;render()}requestAnimationFrame(loop);
</script></body></html>

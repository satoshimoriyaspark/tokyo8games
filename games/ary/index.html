<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>アリィのスクーターRUN｜開発版</title><style>*{box-sizing:border-box}body{margin:0;background:#101b30;color:#fff;font-family:monospace;display:grid;place-items:center;min-height:100dvh}main{width:min(100vw,960px);padding:12px}h1{font-size:clamp(16px,3vw,25px);margin:8px 0}canvas{display:block;width:100%;aspect-ratio:16/9;image-rendering:pixelated;border:4px solid #f5db86;background:#9edaf1}button{background:#ffdc5e;border:3px solid #fff;color:#172239;font:bold 18px monospace;padding:12px 22px;cursor:pointer}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:12px}p{font-size:13px;line-height:1.6}</style></head><body><main><h1>アリィのスクーターRUN <small>亀有 STAGE 1 / 開発版</small></h1><canvas id="game" width="320" height="180" aria-label="横スクロールゲーム"></canvas><div class="controls"><button id="start">START / RETRY</button><button id="jump">JUMP</button></div><p>タップ・Spaceでジャンプ。空中でもう一度ジャンプ可能。コインを集め、コーンを避けよう。キャラクターは正式素材ではない仮表示です。</p></main><script>
const c=document.getElementById('game'),g=c.getContext('2d');g.imageSmoothingEnabled=false;
let running=false,over=false,t=0,score=0,coins=0,hits=0,player={y:120,vy:0,j:0},items=[];
function reset(){running=true;over=false;t=0;score=0;coins=0;hits=0;player={y:120,vy:0,j:0};items=[]}
function jump(){if(!running){reset();return}if(player.j<2){player.vy=-5.2;player.j++}}
document.getElementById('start').onclick=reset;document.getElementById('jump').onclick=jump;
c.addEventListener('pointerdown',jump);document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!e.repeat)jump()}});
function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(Math.floor(x),Math.floor(y),w,h)}
function text(s,x,y,col='#fff',size=9){g.fillStyle=col;g.font='bold '+size+'px monospace';g.fillText(s,x,y)}
function frame(){requestAnimationFrame(frame);if(running){t++;player.vy+=.29;player.y+=player.vy;if(player.y>=120){player.y=120;player.vy=0;player.j=0}if(t%42===0)items.push({x:340,y:82+(t%3)*8,kind:'coin',got:false});if(t%125===0)items.push({x:340,y:128,kind:'cone',got:false});for(const o of items){o.x-=2.4;if(!o.got&&o.x>45&&o.x<65){if(o.kind==='coin'&&Math.abs(o.y-(player.y-16))<23){o.got=true;coins++;score+=10}if(o.kind==='cone'&&player.y>107){o.got=true;hits++;score=Math.max(0,score-50);if(hits>=3){running=false;over=true}}}}items=items.filter(o=>o.x>-20&&!o.got);if(t>=3600){running=false;over=true;score+=5000}}
rect(0,0,320,180,'#95d9ee');rect(0,94,320,52,'#a5c6a2');for(let i=0;i<7;i++){let x=((i*58-t*.35)%400+400)%400-55;rect(x,42+(i%2)*12,49,88,['#db9c81','#b4b2c9','#d5bd7f'][i%3]);rect(x+4,55+(i%2)*12,40,13,'#fff0c9');rect(x+7,76+(i%2)*12,12,17,'#6b9fbc');rect(x+26,76+(i%2)*12,12,17,'#6b9fbc');rect(x+2,102+(i%2)*12,45,4,'#a35f68')}
rect(0,141,320,39,'#697281');rect(0,138,320,4,'#ddd7b8');for(let i=0;i<9;i++)rect(((i*45-t*2)%380+380)%380,160,20,2,'#f5e3a3');
for(const o of items){if(o.kind==='coin'){rect(o.x,o.y,10,10,'#ffcb37');rect(o.x+3,o.y+2,4,6,'#fff3a5')}else{rect(o.x+3,126,8,13,'#e46a42');rect(o.x+1,136,12,3,'#fff')}}
let py=player.y;rect(47,py-26,13,12,'#483f61');rect(49,py-22,10,10,'#f5c8a5');rect(46,py-10,15,16,'#e75d76');rect(48,py+5,4,7,'#334e77');rect(57,py+5,4,7,'#334e77');rect(42,py+13,33,3,'#344a5d');rect(44,py+16,7,7,'#202a3d');rect(67,py+16,7,7,'#202a3d');rect(69,py-7,3,20,'#344a5d');
rect(0,0,320,21,'#172b46');text('COIN '+coins+'  SCORE '+score+'  HIT '+hits+'/3',8,14);
if(!running){rect(32,56,256,66,'#172b46');text(over?(hits>=3?'GAME OVER':'STAGE CLEAR'):'KAMEARI SCOOTER RUN',53,80,'#ffe082',13);text('PRESS START / TAP TO PLAY',59,104,'#fff',10)}
}requestAnimationFrame(frame);
</script></body></html>

<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>8BIT ATHLETICS | 陸上5種競技</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101927;color:#f9f4db;font:700 14px monospace;overscroll-behavior:none}.wrap{max-width:900px;margin:auto;padding:12px}header{text-align:center}h1{font-size:clamp(22px,6vw,40px);color:#ffdb65;text-shadow:3px 3px #9e4e45;margin:8px 0}p{line-height:1.6}canvas{width:100%;aspect-ratio:16/9;image-rendering:pixelated;background:#203344;border:5px solid #e5ddc8}#msg{color:#ffdb65;text-align:center;min-height:42px;padding:12px}.buttons,.events,.pads{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:10px 0}button{font:700 14px monospace;background:#2e527b;color:#fff;border:3px solid #e9e5db;border-radius:3px;padding:10px 13px;touch-action:none;user-select:none;cursor:pointer;box-shadow:0 4px #070d16}button:active,.active{transform:translateY(3px);box-shadow:0 1px #070d16!important}.main{background:#278362}.pads{gap:40px}.pads button{width:min(39vw,190px);height:90px;font-size:34px;background:#3977bf}.pads button:last-child{background:#bb4b47}.events button{font-size:11px;padding:8px}.selected{border-color:#ffdb65;color:#ffdb65}#help{text-align:center;min-height:28px;color:#cbd8e1}#results{max-width:630px;margin:10px auto}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #405164;text-align:left}td:last-child,th:last-child{text-align:right}.small{font-size:11px;text-align:center;color:#b8c6d0}
</style></head><body><div class="wrap"><header><h1>8BIT ATHLETICS</h1><p>陸上5種競技 / WEB BETA / 開発版</p></header><canvas id="screen" width="384" height="216"></canvas><div id="msg" aria-live="polite">競技を選んでSTART！</div><div class="buttons"><button class="main" id="start">START</button><button id="cup">5種競技大会</button><button id="reset">タイトルへ</button></div><div id="help"></div><div class="pads"><button id="a">A</button><button id="b">B</button></div><div class="events" id="events"></div><div id="results"></div><p class="small">A/Bキー または画面ボタン。幅跳び・ジャベボールは3回挑戦。自己ベストは端末内に保存。</p></div>
<script>
(()=>{'use strict';
const events=[['100m走','A・Bを交互に連打','time'],['1500m走','A連打。スタミナに注意！','time'],['110mハードル','A連打で走り、Bでジャンプ','time'],['走り幅跳び','A連打→踏切線でB。3回挑戦','length'],['ジャベボール投げ','A連打→B長押しで角度→離して投げる','length']];
const cv=document.querySelector('#screen'),c=cv.getContext('2d'),$=x=>document.querySelector(x),lim=(v,a,b)=>Math.max(a,Math.min(b,v));c.imageSmoothingEnabled=false;
let selected=0,mode='menu',cup=false,results=[],attempt=1,records=[],pos=0,spd=0,sta=100,last='',angle=42,bHeld=false,elapsed=0,prev=0,carry=0,deadline=0,invuln=0,hit=new Set(),feedback='',feedbackTime=0,downs=new Set();
let best={};try{best=JSON.parse(localStorage.getItem('athletics_bests_v1')||'{}')}catch{}
const message=s=>$('#msg').textContent=s;
const label=(i,v)=>events[i][2]==='time'?v.toFixed(2)+'秒':v.toFixed(2)+'m';
function points(i,v){return Math.round(lim(i===0?(35-v)/24:i===1?(110-v)/65:i===2?(45-v)/28:i===3?(v-1)/6:(v-4)/46,0,1)*1000)}
function resetRun(){pos=0;spd=0;sta=100;last='';bHeld=false;angle=42;elapsed=0;invuln=0;hit.clear();feedback=''}
function select(i){if(['run','ready'].includes(mode))return;selected=i;cup=false;mode='menu';render();message(events[i][0]+' を選択しました')}
function render(){ $('#events').replaceChildren();events.forEach((e,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+e[0];b.className=i===selected?'selected':'';b.onclick=()=>select(i);$('#events').appendChild(b)});$('#help').textContent=events[selected][1];const rows=results.map(r=>'<tr><td>'+events[r.i][0]+'</td><td>'+label(r.i,r.v)+'</td><td>'+r.p+'点</td></tr>').join('');$('#results').innerHTML='<p>自己ベスト：'+(best[selected]==null?'—':label(selected,best[selected]))+'</p>'+(results.length?'<table><tr><th>競技</th><th>記録</th><th>得点</th></tr>'+rows+'<tr><th>合計</th><th>'+results.length+'/5</th><th>'+results.reduce((s,r)=>s+r.p,0)+'点</th></tr></table>':'')}
function start(){resetRun();attempt=1;records=[];mode='ready';deadline=performance.now()+1500;message(events[selected][0]+' READY...')}
function input(k){if(mode!=='run')return;if(selected===4&&k==='B'){bHeld=true;return}
if(selected===0){if(k!==last){spd=lim(spd+1.6,0,13.5);last=k;flash('SPEED UP!')}else spd=Math.max(0,spd-.5);return}
if(k==='A'){if(selected===1){spd=lim(spd+(sta>8?1.15:.12),0,11.5);sta=lim(sta-2.9,0,100)}else spd=lim(spd+1.3,0,12.5);return}
if(selected===2&&k==='B'){let next=12+Math.ceil(Math.max(0,pos-12)/10)*10,delta=next-pos;if(delta>=0&&delta<4.6){invuln=elapsed+.44;flash(delta<2?'PERFECT!':'GOOD!')}else flash('TOO EARLY!')}
if(selected===3&&k==='B')finishAttempt()}
function release(k){if(k==='B'&&bHeld){bHeld=false;if(mode==='run'&&selected===4)finishAttempt()}}
function flash(s){feedback=s;feedbackTime=elapsed+.75}
function finishAttempt(){if(mode!=='run')return;let v=0;if(selected===3){v=pos>=32&&pos<=40?lim(1.1+spd*.37+(pos-32)*.12,0,7.8):0}else if(selected===4){v=lim(4+spd*3.6*Math.max(0,1-Math.abs(angle-42)/60),0,55)}else return;records.push(v);mode='between';deadline=performance.now()+1200;message(attempt+'回目：'+(v?label(selected,v):'ファウル'))}
function finish(v){mode='result';v=Math.round(v*100)/100;const old=best[selected],improved=old==null||(events[selected][2]==='time'?v<old:v>old);if(improved){best[selected]=v;try{localStorage.setItem('athletics_bests_v1',JSON.stringify(best))}catch{}}let p=points(selected,v);if(cup){results.push({i:selected,v,p});if(results.length===5){mode='finished';let t=results.reduce((s,r)=>s+r.p,0);message('大会終了！ '+t+'/5000点 '+(t>=4000?'GOLD':t>=3000?'SILVER':t>=2000?'BRONZE':'FINISH'));$('#start').textContent='もう一度大会'}else{message(events[selected][0]+' '+label(selected,v)+' / '+p+'点');$('#start').textContent='次の種目へ'}}else{message(events[selected][0]+' '+label(selected,v)+' / '+p+'点'+(improved?' ★NEW BEST!':''));$('#start').textContent='もう一度'}render()}
function step(dt,t){if(mode==='ready'&&t>=deadline){mode='run';message(events[selected][1])}if(mode==='between'&&t>=deadline){if(attempt<3){attempt++;resetRun();mode='ready';deadline=t+900;message(attempt+'回目 READY...')}else finish(Math.max(...records))}if(mode!=='run')return;elapsed+=dt;
if(selected===4&&bHeld)angle=30+27*Math.sin(elapsed*4.6);
if(selected===1){spd=Math.max(0,spd-(sta<8?2.3:1.35)*dt);sta=lim(sta+(spd<7?10:3)*dt,0,100)}else spd=Math.max(0,spd-1.55*dt);
let factor=selected===1?1.85:selected>=3?.85:1.1,old=pos;pos+=spd*factor*dt;
if(selected===2){for(let i=0;i<10;i++){const h=12+10*i;if(old<h&&pos>=h&&!hit.has(i)){hit.add(i);if(elapsed>invuln){spd*=.48;flash('HIT!')}else flash('CLEAR!')}}}
const goal=selected===1?150:selected===2?110:selected>=3?40:100;
if(pos>=goal){pos=goal;if(selected>=3)finishAttempt();else finish(elapsed)}
if(elapsed>150){if(selected>=3)finishAttempt();else finish(elapsed)}
}
const rect=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))},txt=(s,x,y,size=11,col='#fff',align='left')=>{c.font='bold '+size+'px monospace';c.fillStyle=col;c.textAlign=align;c.fillText(s,x,y);c.textAlign='left'};
function draw(t){rect(0,0,384,216,'#24384a');rect(0,35,384,42,'#365e4d');for(let i=0;i<70;i++)rect(i*43%384,41+i%4*8,3,3,['#ffdf74','#d0ddeb','#e99a8d'][i%3]);for(let i=0;i<4;i++){rect(0,77+i*29,384,28,i%2?'#9b4038':'#b34e43');rect(0,104+i*29,384,2,'#e9c69f')}rect(0,0,384,34,'#101927');txt(events[selected][0],8,13,12,'#ffdb65');txt('TIME '+elapsed.toFixed(2),8,27);txt('SPD '+Math.floor(spd*10),272,13,10);if(selected===1)txt('STA '+Math.floor(sta),273,27,10,'#7be2a8');if(selected===4)txt('ANGLE '+Math.floor(angle),260,27,10,'#ffdb65');
let goal=selected===1?150:selected===2?110:selected>=3?40:100;rect(8,203,368,7,'#405366');rect(8,203,368*lim(pos/goal,0,1),7,'#75df9c');txt(Math.floor(pos)+'/'+goal,8,196,9);
let cam=selected>=3?0:Math.max(0,pos-55),x=selected>=3?32+pos*7.1:31+(pos-cam)*2.5;
if(selected===2)for(let i=0;i<10;i++){let h=31+(12+i*10-cam)*2.5;if(h>-10&&h<390){rect(h,122,4,43,'#f7eedf');rect(h-4,119,21,5,'#ffdc64')}}
if(selected>=3){rect(326,78,4,110,'#ffde65');if(selected===3)rect(330,107,54,80,'#d9b474')}
let y=122-(selected===2&&elapsed<invuln?22:0),s=spd>1?Math.floor(t/90)%2:0;rect(x+5,y,11,11,'#f2b982');rect(x+5,y,11,3,'#282533');rect(x+2,y+12,18,13,'#ffcb54');rect(x+(s?3:13),y+25,5,11,'#f2b982');rect(x+(s?13:3),y+25,5,11,'#f2b982');rect(x-2,y+13,5,9,'#f2b982');rect(x+18,y+13,5,9,'#f2b982');
if(selected===4&&bHeld){rect(104,44,176,12,'#111b2b');rect(104,44,176*(angle+1)/60,12,'#ffce53');txt('RELEASE B!',192,70,11,'#fff','center')}if(feedback&&elapsed<feedbackTime)txt(feedback,192,68,17,'#ffdb65','center');
if(mode!=='run'){rect(78,80,232,61,'#0d1420');rect(82,84,224,53,'#3c5776');txt(mode==='menu'?'SELECT & START':mode==='ready'?'READY ...':mode==='between'?'NEXT ATTEMPT':mode==='finished'?'TOURNAMENT END':'FINISH!',192,110,16,'#ffdb65','center');txt(mode==='finished'?results.reduce((s,r)=>s+r.p,0)+'/5000':mode==='menu'?'A / B BUTTONS':'8BIT ATHLETICS',192,130,10,'#fff','center')}}
function loop(t){const dt=Math.min((t-prev||16)/1000,.05);prev=t;carry+=dt;let n=0;while(carry>=1/60&&n++<4){step(1/60,t);carry-=1/60}draw(t);requestAnimationFrame(loop)}
$('#start').onclick=()=>{if(cup&&mode==='result'&&results.length<5){selected=results.length;render();start()}else if(cup&&mode==='finished'){results=[];selected=0;render();start()}else start()};
$('#cup').onclick=()=>{cup=true;selected=0;results=[];$('#start').textContent='次の種目へ';render();start()};
$('#reset').onclick=()=>{cup=false;results=[];mode='menu';resetRun();$('#start').textContent='START';render();message('競技を選んでSTART！')};
for(const k of ['a','b']){const el=$('#'+k),K=k.toUpperCase();el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch{}el.classList.add('active');input(K)});for(const event of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(event,e=>{e.preventDefault();el.classList.remove('active');release(K)})}
document.addEventListener('keydown',e=>{let k=e.key.toUpperCase();if(!['A','B'].includes(k))return;e.preventDefault();if(downs.has(k))return;downs.add(k);$('#'+k.toLowerCase()).classList.add('active');input(k)});
document.addEventListener('keyup',e=>{let k=e.key.toUpperCase();if(!['A','B'].includes(k))return;downs.delete(k);$('#'+k.toLowerCase()).classList.remove('active');release(k)});
window.addEventListener('blur',()=>{downs.clear();if(bHeld)release('B');for(const e of document.querySelectorAll('.pads button'))e.classList.remove('active')});
render();requestAnimationFrame(loop);
})();
</script></body></html>

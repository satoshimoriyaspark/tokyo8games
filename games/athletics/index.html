  if(cpuIndex<0)age=elapsed-jumpStarted;
  else{
   const pace=6.8*rivals[cpuIndex].skill;
   const nearest=12+Math.round((travel-12)/10)*10;
   if(nearest>=12&&nearest<=102)age=.34+(travel-nearest)/pace;
  }
 }
 if(selected===2&&isRun&&age>=0&&age<.68){
  row=6;frame=Math.min(6,Math.floor(age/.68*7));lift=[0,4,14,19,17,7,0][frame];
 }else if(selected===4&&bHeld&&isRun){
  const held=elapsed-throwHeldStart;
  if(held<.16){row=7;frame=1;}
  else{row=8;frame=held<.38?0:1;}
 }else if(selected===4&&phase==='between'){
  if(throwAge<.22){row=8;frame=2;}
  else{row=10;frame=throwAge<.76?0:1;}
 }else if(selected===4&&isRun){
  row=7;frame=spd>.1?1:0;
 }else if(selected===4){row=7;frame=0;
 }else if(selected===3&&phase==='between'){
  row=9;frame=Math.min(2,Math.floor(Math.max(0,1.2-(deadline-performance.now())/1000)/.4));
 }else if(isRun&&travel>.01){
  if(travel<.5){row=1;frame=Math.min(2,Math.floor(travel*5));}
  else{const jog=selected===1;row=jog?3:2;frame=Math.floor(travel*(jog?1.2:2.8)+seed*.5)%(jog?6:8);}
 }
 blitSprite(x,y-lift,row,frame,cpuIndex,true);
}
function drawProp(which,x,y){
 if(!spriteReady)return;
 const w=which===0?16:22,h=which===0?11:22;
 c.imageSmoothingEnabled=false;
 c.drawImage(spriteVariants[0][11],which*FRAME_SIZE,0,w,h,Math.round(x),Math.round(y),w,h);
}
function drawJaveBallFlight(){
 if(selected!==4||mode!=='between'||!spriteReady||throwAge>1.2)return;
 const u=Math.min(1,throwAge/1.2), launchX=32+throwOrigin*7.1+12;
 const flightX=launchX+u*135,flightY=252-Math.sin(u*Math.PI)*68+u*20;
 drawProp(0,flightX,flightY);
}
function drawFrontSprite(x,y,kind='podium',frame=0,cpuIndex=-1){blitSprite(x,y,kind==='victory'?4:5,kind==='victory'?frame:0,cpuIndex,false);}
function draw(t){rect(0,0,384,320,'#24384a');rect(0,35,384,42,'#365e4d');for(let i=0;i<70;i++)rect(i*43%384,41+i%4*8,3,3,['#ffdf74','#d0ddeb','#e99a8d'][i%3]);for(let i=0;i<4;i++){rect(0,77+i*53,384,52,i%2?'#9b4038':'#b34e43');rect(0,128+i*53,384,2,'#e9c69f')}rect(0,0,384,34,'#101927');txt(events[selected][0],8,13,12,'#ffdb65');txt('TIME '+elapsed.toFixed(2),8,27);txt('SPD '+Math.floor(spd*10),272,13,10);if(selected===1)txt('STA '+Math.floor(sta),273,27,10,'#7be2a8');if(selected===4)txt('ANGLE '+Math.floor(angle),260,27,10,'#ffdb65');

let scale=selected===1?10:selected===2?8:6,follow=selected===1?22:selected===2?27:35,cam=selected>=3?0:Math.max(0,pos-follow),x=selected>=3?32+pos*7.1-14:54+(pos-cam)*scale-14;
if(selected<3){let px=w=>54+(w-cam)*scale,st=px(0),ed=px(goal);if(st>=0&&st<=384){rect(st,77,4,212,'#f9f9f9');rect(st+1,77,2,212,'#fff4c9');txt('START',Math.max(2,st-42),91,10,'#ffdb65')}if(ed>=0&&ed<=384){rect(ed,77,6,212,'#f9f9f9');for(let z=0;z<20;z++)rect(ed,77+z*11,6,Math.min(11,212-z*11),z%2?'#101927':'#fff');txt('GOAL',Math.min(351,ed-28),87,11,'#ffdc64')}rivals.forEach((r,j)=>{let rx=px(r.dist)-14;if(rx>-24&&rx<398){drawRunnerSprite(rx,82+j*53,r.dist,mode,j,j);txt('CPU'+(j+1),Math.max(0,rx-8),80+j*53,9,'#fff')}});txt('YOU '+currentRank+'/4',245,67,12,'#ffdb65')}
// The finish stripe is sufficient. The former 24x3 tape looked like track debris.
if(selected<3){let spacing=selected===1?12.5:selected===2?10:25;for(let d=spacing;d<goal;d+=spacing){let mx=54+(d-cam)*scale;if(mx>15&&mx<370){rect(mx,77,1,211,selected===1?'#e5b97d':'#e8c99b');let meter=selected===1?Math.round(d*10):Math.round(d);if(selected!==1||meter%250===0)txt(meter+'m',mx+3,298,10,'#fff4d3')}}}
if(selected===2)for(let i=0;i<10;i++){
 const h=54+(12+i*10-cam)*scale;
 if(h>-24&&h<400){
  for(let lane=0;lane<4;lane++)drawProp(1,h-7,105+lane*53);
  const delta=12+i*10-pos;
  if(mode==='run'&&delta>=0&&delta<4.6)txt('B!',h,230,12,'#ffdb65','center');
 }
}
if(selected>=3){rect(326,77,4,212,'#ffde65');if(selected===3){rect(299,265,27,8,'#72db91');rect(330,190,54,99,'#d9b474');txt('Bで踏切!',290,177,12,'#ffdb65','center')}else txt('B長押し→離す',192,177,12,'#ffdb65','center')}
let y=241;drawRunnerSprite(x,y,pos,mode,4);drawJaveBallFlight();if(selected<3)txt('YOU',Math.max(2,x+1),y-4,9,'#ffdb65');
if(mode==='finishDash')txt('GOAL! →',192,69,18,'#ffdb65','center');if(selected===1){rect(106,44,172,11,'#111b2b');rect(106,44,172*sta/100,11,sta<25?'#e46b64':'#75df9c');txt('STAMINA',106,69,11,'#fff');txt('SECTION '+Math.min(4,Math.floor(pos/37.5)+1)+'/4',8,69,10,'#ffdb65')}if(selected===2){txt('HURDLE '+Math.min(10,hit.size+1)+'/10',8,69,11,'#ffdb65')}if(selected===0&&mode==='run')txt('NEXT: '+(last==='A'?'B':'A'),186,66,14,'#ffdb65','center');if(selected===4&&bHeld){rect(104,44,176,12,'#111b2b');rect(104,44,176*(angle+1)/60,12,'#ffce53');rect(104+176*42/60,42,3,16,'#75df9c');txt('42°をねらえ! Bを離す',192,70,11,'#fff','center')}if(feedback&&elapsed<feedbackTime)txt(feedback,8,68,10,'#ffdb65','left');
if(mode!=='run'&&mode!=='finishDash'&&mode!=='ceremony'&&!(selected===4&&mode==='between')){rect(78,134,232,61,'#0d1420');rect(82,138,224,53,'#3c5776');txt(mode==='menu'?'SELECT & START':mode==='tutorial'?'HOW TO PLAY':mode==='ready'?'READY ...':mode==='between'?'NEXT ATTEMPT':mode==='finished'?'TOURNAMENT END':'FINISH!',192,164,16,'#ffdb65','center');txt(mode==='finished'?results.reduce((s,r)=>s+r.p,0)+'/5000':mode==='ready'?'選手は GO で走り出す':mode==='menu'?'A / B BUTTONS':'8BIT ATHLETICS',192,184,10,'#fff','center')}}
function drawTapeBurst(t){
 const p=finishDashTime;
 if(selected>=3||mode!=='finishDash'||p<0||p>1.1)return;
 for(let i=0;i<18;i++){
  const angle=i*Math.PI*2/18;
  const radius=9+p*84,xx=192+Math.cos(angle)*radius,yy=172+Math.sin(angle)*radius*.62+p*p*32;
  rect(xx,yy,6,4,['#ffdc55','#fff7da','#72d9ef','#ef7474'][i%4]);
 }
 if(p<.8){rect(115,113,154,7,'#f8edd7');txt('GOAL!!',192,102,25,'#ffdc55','center')}
}
function drawCeremony(t){
 const p=ceremonyTime;
 rect(0,35,384,285,'#16233a');
 for(let i=0;i<35;i++){const y=(i*29+Math.floor(p*22))%270+39;rect((i*73)%384,y,3,5,['#eec65c','#f9f2d8','#81d7f3'][i%3])}

  for(const o of order){const racer=top[o.rank-1];if(!racer)continue;
   rect(o.x,o.y,76,o.h,o.rank===1?'#c39839':o.rank===2?'#91a1b1':'#a26b48');
   rect(o.x,o.y,76,5,'#f7e4a0');txt(String(o.rank),o.x+38,o.y+30,23,'#fff','center');
   drawFrontSprite(o.x+24,o.y-49,'podium',0,racer.name==='YOU'?-1:Number(racer.name.slice(-1))-1);
   txt(racer.name,o.x+38,o.y-56,11,'#fff','center');
  }
  txt('TOTAL '+ceremonyScores.find(r=>r.name==='YOU').score+' POINTS',192,293,17,'#ffdb65','center');
 }else{
  txt('EVENT RESULT',192,94,23,'#ffdb65','center');
  txt(['','1st PLACE!','2nd PLACE','3rd PLACE','4th PLACE'][ceremonyRank],192,167,28,'#fff','center');
  txt('記録と順位を確認しよう',192,242,14,'#ffdb65','center');
 }
}
function loop(t){const dt=Math.min((t-prev||16)/1000,.05);prev=t;carry+=dt;let n=0;while(carry>=1/60&&n++<4){step(1/60,t);carry-=1/60}draw(t);if(mode==='finishDash')drawTapeBurst(t);if(mode==='ceremony')drawCeremony(t);requestAnimationFrame(loop)}
$('#start').onclick=()=>{if(!spriteReady||mode==='finishDash'||mode==='ceremony')return;if(cup&&mode==='result'&&results.length<5){selected=results.length;render();start()}else if(cup&&mode==='finished'){results=[];cpuTotal=[0,0,0];selected=0;render();start()}else start()};
$('#cup').onclick=()=>{if(!spriteReady||mode==='finishDash'||mode==='ceremony')return;cup=true;selected=0;results=[];cpuTotal=[0,0,0];$('#start').textContent='次の種目へ';render();start()};
$('#reset').onclick=()=>{$('#start').disabled=!spriteReady;$('#cup').disabled=!spriteReady;$('#resultPanel').hidden=true;$('#tutorial').hidden=true;cup=false;results=[];cpuTotal=[0,0,0];mode='menu';resetRun();$('#start').textContent='START';render();message('競技を選んでSTART！')};
for(const k of ['a','b']){const el=$('#'+k),K=k.toUpperCase();el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch{}el.classList.add('active');input(K)});for(const event of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(event,e=>{e.preventDefault();el.classList.remove('active');release(K)})}
document.addEventListener('keydown',e=>{let k=e.key.toUpperCase();if(!['A','B'].includes(k))return;e.preventDefault();if(downs.has(k))return;downs.add(k);$('#'+k.toLowerCase()).classList.add('active');input(k)});
document.addEventListener('keyup',e=>{let k=e.key.toUpperCase();if(!['A','B'].includes(k))return;downs.delete(k);$('#'+k.toLowerCase()).classList.remove('active');release(k)});
window.addEventListener('blur',()=>{downs.clear();bHeld=false;for(const e of document.querySelectorAll('.pads button'))e.classList.remove('active')});
render();requestAnimationFrame(loop);
})();

if(selected===2&&k==='B'){let next=12+Math.ceil(Math.max(0,pos-12)/10)*10,delta=next-pos;if(delta>=0&&delta<4.6){invuln=elapsed+.44;flash(delta<2?'PERFECT!':'GOOD!')}else flash('TOO EARLY!')}

function cpuRaceTime(j,i){

  if(next>=goal)return sec+(goal-dist)/pace;
  dist=next;sec+=dt;
 }

}

const ranking=[{name:'YOU',score:p,record:v,you:true},...cpuPts.map((score,j)=>({name:'CPU '+(j+1),score,record:cpuVals[j],you:false}))].sort((a,b)=>selected<3?a.record-b.record:b.record-a.record);

$('#resultRanking').replaceChildren();
[{name:'YOU',score:t,you:true},...cpuTotal.map((score,j)=>({name:'CPU '+(j+1),score,you:false}))].sort((a,b)=>b.score-a.score).forEach((r,i)=>{const tr=document.createElement('tr');if(r.you)tr.className='you';[(i+1)+'位',r.name,r.score+'点'].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});$('#resultRanking').appendChild(tr)});
$('#resultHint').textContent='大会終了！ もう一度挑戦できます。';$('#start').textContent='もう一度大会'}else{message(events[selected][0]+' '+label(selected,v)+' / '+p+'点　'+thisRank+'位 / 4人');$('#start').textContent='次の種目へ'}}else{message(events[selected][0]+' '+label(selected,v)+' / '+p+'点　'+thisRank+'位 / 4人'+(improved?' ★NEW BEST!':''));$('#start').textContent='もう一度'}render();ceremonyTime=0;mode='ceremony';$('#start').disabled=true;$('#cup').disabled=true;}
function step(dt,t){
if(mode==='ceremony'){ceremonyTime+=dt;if(ceremonyTime>=3.7){mode=ceremonyTotal?'finished':'result';$('#resultPanel').hidden=false;$('#start').disabled=false;$('#cup').disabled=false;}return;}

 // The clock and rank are frozen at the line. Animation continues beyond it.

}

 else {goalBurst=1;finishDashRecord=elapsed;finishDashSpeed=Math.max(7,spd*(selected===0?.39:selected===1?1.85:1.1));finishDashTime=0;mode='finishDash';message('GOAL! 駆け抜けろ！')}

const rect=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))},txt=(s,x,y,size=11,col='#fff',align='left')=>{c.font='bold '+size+'px monospace';c.fillStyle=col;c.textAlign=align;c.fillText(s,x,y);c.textAlign='left'};
// Racing sprites face right. Ceremony sprites deliberately face the audience.
// Six distinct right-facing running poses. Hands, elbows, knees and feet have separate joints.
// Coordinates describe a slim sprite, not a front-facing stick figure.
function pixelLimb(x1,y1,x2,y2,color,weight=2){
 const dx=x2-x1,dy=y2-y1,steps=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))));
 for(let i=0;i<=steps;i++){const f=i/steps;rect(x1+dx*f,y1+dy*f,weight,weight,color)}
}
// Explicit two-segment joints. 8 frames exaggerate elbow and knee flexion for readability.
// Each pose: near knee, near ankle, far knee, far ankle, near elbow, near hand, far elbow, far hand.
const sprintPoses=[
 [19,35,28,43,  2,39,-3,47,  19,15,12,11,  1,22, 6,28],
 [22,32,30,39,  4,36,-5,43,  20,17,12,11,  2,24, 9,30],
 [20,34,22,45,  8,37,-2,42,  18,20, 9,15,  5,18, 0,12],
 [14,37, 9,47, 17,33,27,40,  11,23, 2,17, 16,18,23,13],
 [ 5,34,-4,41, 21,33,28,44,   4,21, 0,14, 19,18,12,12],
 [ 2,33,-6,39, 20,36,22,46,   5,17,12,12, 18,21,10,16],
 [ 6,36, 0,46, 16,37,10,47,   9,17,16,12, 16,23,22,18],
 [14,38,22,46,  8,35,-1,42,  17,17,10,12,  6,23, 0,17]
];
// Anatomical two-link arms and legs: interpolate discrete pixel-art joint poses.
// Frame cadence follows distance actually travelled, so faster runners swing faster.
function runner(x,y,shirt,t,seed,travel,phase){
 const moving=(phase==='run'||phase==='finishDash')&&travel>0.1;
 const sprint=selected===0, distanceRace=selected===1;
 const cyclesPerUnit=sprint?0.32:distanceRace?0.18:0.26;
 const progression=moving?travel*cyclesPerUnit*8+seed*.9:0;
 const idx=Math.floor(progression)%8, blend=progression-Math.floor(progression);
 const poseA=sprintPoses[idx],poseB=sprintPoses[(idx+1)%8];
 const idle=[9,38,9,47,6,38,6,47,17,24,18,31,4,24,3,31];
 const p=moving?poseA.map((v,i)=>v+(poseB[i]-v)*blend):idle;
 // Sprint: more forward knee drive and larger shoulder rotation.
 // Distance: compact motion to suggest economical cadence and relaxed form.
 if(moving&&distanceRace){
  const neutral=[10,38,10,44,7,38,7,44,13,21,13,23,7,21,7,23];
  for(let i=0;i<p.length;i++)p[i]=neutral[i]+(p[i]-neutral[i])*.72;
 }
 if(moving&&sprint){
  p[0]=10+(p[0]-10)*1.09;
  p[4]=8+(p[4]-8)*1.09;
  p[8]=11+(p[8]-11)*1.08;
  p[12]=7+(p[12]-7)*1.08;
 }
 const bob=moving?-Math.round((1-Math.cos(progression*Math.PI/2))*.7):0;
 y+=bob;
 // Far arm and leg (darker shades), elbows and knees drawn as unmistakable bends.
 pixelLimb(x+8,y+29,x+p[4],y+p[5],'#ad7758',3);
 pixelLimb(x+p[4],y+p[5],x+p[6],y+p[7],'#c18a66',2);
 rect(x+p[4]-1,y+p[5]-1,3,3,'#d69a75');
 rect(x+p[6]-1,y+p[7],7,3,'#d5cec2');
 pixelLimb(x+7,y+17,x+p[12],y+p[13],'#ab7657',3);
 pixelLimb(x+p[12],y+p[13],x+p[14],y+p[15],'#bf8b67',2);
 rect(x+p[12]-1,y+p[13]-1,3,3,'#d49b75');
 // Body tilted to the right, narrow torso and single visible eye.
 // Friendly, slightly larger 3-heads-tall profile: rounded pixel outline without losing rightward gaze.
 // Chest is fuller but does not obscure the independently animated elbows.
 rect(x+7,y+15,9,13,shirt);
 rect(x+6,y+16,2,10,shirt);
 rect(x+6,y+27,9,4,'#29374e');
 rect(x+10,y+13,3,3,'#e0a47a');
 // Head: 11x12 pixels, one eye at the forward edge, cheek and small smile.
 rect(x+4,y+2,10,11,'#edb484');
 rect(x+6,y+1,9,3,'#302b37');
 rect(x+4,y+4,2,6,'#302b37');
 rect(x+6,y+0,5,2,'#302b37'); // soft hair tuft
 rect(x+14,y+7,3,3,'#f2b982'); // nose points to the right
 rect(x+12,y+6,2,2,'#182334'); // single visible eye
 rect(x+12,y+10,2,2,'#da8f6c'); // cheek
 rect(x+13,y+12,2,1,'#ad6d57'); // mouth
 // Near arm bends at elbow; hand is an independent end point.
 pixelLimb(x+14,y+18,x+p[8],y+p[9],'#f2b982',3);

 // Near leg: thigh -> knee -> shin -> shoe; each segment rotates distinctly.

 rect(x+p[2]-1,y+p[3],7,3,'#ffffff');
}

function draw(t){rect(0,0,384,320,'#24384a');rect(0,35,384,42,'#365e4d');for(let i=0;i<70;i++)rect(i*43%384,41+i%4*8,3,3,['#ffdf74','#d0ddeb','#e99a8d'][i%3]);for(let i=0;i<4;i++){rect(0,77+i*53,384,52,i%2?'#9b4038':'#b34e43');rect(0,128+i*53,384,2,'#e9c69f')}rect(0,0,384,34,'#101927');txt(events[selected][0],8,13,12,'#ffdb65');txt('TIME '+elapsed.toFixed(2),8,27);txt('SPD '+Math.floor(spd*10),272,13,10);if(selected===1)txt('STA '+Math.floor(sta),273,27,10,'#7be2a8');if(selected===4)txt('ANGLE '+Math.floor(angle),260,27,10,'#ffdb65');

if(selected<3&&mode==='run'&&pos>goal-18&&pos<goal){const lineX=54+(goal-cam)*scale;if(lineX>0&&lineX<384){rect(lineX-3,252,24,3,'#ffecba');rect(lineX+1,250,3,8,'#fff');}}
if(selected<3){let spacing=selected===1?12.5:selected===2?10:25;for(let d=spacing;d<goal;d+=spacing){let mx=54+(d-cam)*scale;if(mx>15&&mx<370){rect(mx,77,1,211,selected===1?'#e5b97d':'#e8c99b');let meter=selected===1?Math.round(d*10):Math.round(d);if(selected!==1||meter%250===0)txt(meter+'m',mx+3,298,10,'#fff4d3')}}}
if(selected===2)for(let i=0;i<10;i++){let h=54+(12+i*10-cam)*scale;if(h>-10&&h<390){rect(h,242,4,44,'#f7eedf');rect(h-4,239,21,5,'#ffdc64');if(h>35&&h<150&&mode==='run')txt('B!',h,229,12,'#ffdb65','center')}}
if(selected>=3){rect(326,77,4,212,'#ffde65');if(selected===3){rect(299,265,27,8,'#72db91');rect(330,190,54,99,'#d9b474');txt('Bで踏切!',290,177,12,'#ffdb65','center')}else txt('B長押し→離す',192,177,12,'#ffdb65','center')}
let y=selected<3?241:241;if(selected===2&&elapsed<invuln)y-=17;runner(x,y,'#ffcb54',t,4,pos,mode);if(selected<3)txt('YOU',Math.max(2,x+1),y-4,9,'#ffdb65');
if(mode==='finishDash')txt('GOAL! →',192,69,18,'#ffdb65','center');if(selected===1){rect(106,44,172,11,'#111b2b');rect(106,44,172*sta/100,11,sta<25?'#e46b64':'#75df9c');txt('STAMINA',106,69,11,'#fff');txt('LAP '+Math.min(4,Math.floor(pos/37.5)+1)+'/4',290,69,12,'#ffdb65')}if(selected===2){txt('HURDLE '+Math.min(10,hit.size+1)+'/10',266,69,11,'#ffdb65')}if(selected===0&&mode==='run')txt('NEXT: '+(last==='A'?'B':'A'),192,66,18,'#ffdb65','center');if(selected===4&&bHeld){rect(104,44,176,12,'#111b2b');rect(104,44,176*(angle+1)/60,12,'#ffce53');rect(104+176*42/60,42,3,16,'#75df9c');txt('42°をねらえ! Bを離す',192,70,11,'#fff','center')}if(feedback&&elapsed<feedbackTime)txt(feedback,192,68,17,'#ffdb65','center');
if(mode!=='run'&&mode!=='finishDash'&&mode!=='ceremony'){rect(78,134,232,61,'#0d1420');rect(82,138,224,53,'#3c5776');txt(mode==='menu'?'SELECT & START':mode==='tutorial'?'HOW TO PLAY':mode==='ready'?'READY ...':mode==='between'?'NEXT ATTEMPT':mode==='finished'?'TOURNAMENT END':'FINISH!',192,164,16,'#ffdb65','center');txt(mode==='finished'?results.reduce((s,r)=>s+r.p,0)+'/5000':mode==='ready'?'選手は GO で走り出す':mode==='menu'?'A / B BUTTONS':'8BIT ATHLETICS',192,184,10,'#fff','center')}}
function drawTapeBurst(t){
 const p=finishDashTime;
 if(p>1.1)return;
 // Ribbons fly outward from the finish-line impact, then fall.
 for(let i=0;i<18;i++){
  const angle=i*Math.PI*2/18;
  const radius=9+p*84,xx=192+Math.cos(angle)*radius,yy=172+Math.sin(angle)*radius*.62+p*p*32;
  rect(xx,yy,6,4,['#ffdc55','#fff7da','#72d9ef','#ef7474'][i%4]);
 }
 if(p<.8){rect(115,113,154,7,'#f8edd7');txt('GOAL!!',192,102,25,'#ffdc55','center')}
}
function drawCeremony(t){
 const p=ceremonyTime;
 rect(0,35,384,285,'#16233a');
 for(let i=0;i<35;i++){const y=(i*29+Math.floor(p*22))%270+39;rect((i*73)%384,y,3,5,['#eec65c','#f9f2d8','#81d7f3'][i%3])}
 if(p<1.25){

 }else if(p<2.2){

 }else if(ceremonyTotal){
  txt('AWARD CEREMONY',192,66,19,'#ffdb65','center');
  const top=ceremonyScores.slice(0,3),order=[{rank:2,x:66,y:197,h:51},{rank:1,x:154,y:173,h:75},{rank:3,x:242,y:211,h:37}];
  for(const o of order){const racer=top[o.rank-1];if(!racer)continue;
   rect(o.x,o.y,76,o.h,o.rank===1?'#c39839':o.rank===2?'#91a1b1':'#a26b48');
   rect(o.x,o.y,76,5,'#f7e4a0');txt(String(o.rank),o.x+38,o.y+30,23,'#fff','center');
   frontRunner(o.x+27,o.y-49,racer.color);
   txt(racer.name,o.x+38,o.y-56,11,'#fff','center');
  }
  txt('TOTAL '+ceremonyScores.find(r=>r.name==='YOU').score+' POINTS',192,293,17,'#ffdb65','center');
 }else{
  txt('EVENT RESULT',192,94,23,'#ffdb65','center');
  txt(ceremonyRank===1?'1st PLACE!':ceremonyRank+'th PLACE',192,167,28,'#fff','center');
  txt('記録と順位を確認しよう',192,242,14,'#ffdb65','center');
 }
}
function loop(t){const dt=Math.min((t-prev||16)/1000,.05);prev=t;carry+=dt;let n=0;while(carry>=1/60&&n++<4){step(1/60,t);carry-=1/60}draw(t);if(mode==='finishDash')drawTapeBurst(t);if(mode==='ceremony')drawCeremony(t);requestAnimationFrame(loop)}
$('#start').onclick=()=>{if(mode==='finishDash'||mode==='ceremony')return;if(cup&&mode==='result'&&results.length<5){selected=results.length;render();start()}else if(cup&&mode==='finished'){results=[];cpuTotal=[0,0,0];selected=0;render();start()}else start()};
$('#cup').onclick=()=>{if(mode==='finishDash'||mode==='ceremony')return;cup=true;selected=0;results=[];cpuTotal=[0,0,0];$('#start').textContent='次の種目へ';render();start()};
$('#reset').onclick=()=>{$('#start').disabled=false;$('#cup').disabled=false;$('#resultPanel').hidden=true;$('#tutorial').hidden=true;cup=false;results=[];cpuTotal=[0,0,0];mode='menu';resetRun();$('#start').textContent='START';render();message('競技を選んでSTART！')};
for(const k of ['a','b']){const el=$('#'+k),K=k.toUpperCase();el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch{}el.classList.add('active');input(K)});for(const event of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(event,e=>{e.preventDefault();el.classList.remove('active');release(K)})}
document.addEventListener('keydown',e=>{let k=e.key.toUpperCase();if(!['A','B'].includes(k))return;e.preventDefault();if(downs.has(k))return;downs.add(k);$('#'+k.toLowerCase()).classList.add('active');input(k)});
document.addEventListener('keyup',e=>{let k=e.key.toUpperCase();if(!['A','B'].includes(k))return;downs.delete(k);$('#'+k.toLowerCase()).classList.remove('active');release(k)});
window.addEventListener('blur',()=>{downs.clear();if(bHeld)release('B');for(const e of document.querySelectorAll('.pads button'))e.classList.remove('active')});
render();requestAnimationFrame(loop);
})();

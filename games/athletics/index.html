<div class="wrap" id="gameView" hidden><header class="game-header"><h1>8BIT ATHLETICS</h1><button id="sound" aria-pressed="true">音：ON</button></header><h2 id="menuTitle" tabindex="-1">競技を選ぶ</h2><label id="difficultyControl">難易度 <select id="difficulty" aria-label="難易度"><option value="0">1 やさしい</option><option value="1">2 気軽に</option><option value="2" selected>3 スタンダード</option><option value="3">4 むずかしい</option><option value="4">5 チャンピオン</option></select></label><canvas tabindex="-1" aria-label="競技画面" id="screen" width="384" height="320"></canvas><section id="tutorial" hidden><h2 id="tutorialTitle" tabindex="-1"></h2><p id="tutorialText"></p><p id="tutorialHint"></p><button class="main" id="tutorialGo">スタート</button></section><section id="resultPanel" hidden aria-live="polite"><h2 id="resultHeading" tabindex="-1">RESULT</h2><div id="resultRecord" class="record"></div><div id="resultRank" class="resultRank"></div><div id="resultMeta" class="resultMeta"></div><table class="rankTable" id="resultRanking"></table><p class="hint" id="resultHint"></p></section><p id="spriteStatus" class="small" aria-live="polite">キャラクター：画像ロード中</p><div id="msg" aria-live="polite">競技を選んでSTART！</div><div class="buttons"><button class="main" id="start">START</button><button id="cup">5種競技大会</button><button id="reset">タイトルへ</button><button id="menuBack">競技選択へ</button><button id="skipCeremony">結果を見る</button></div><div id="help"></div><div class="pads"><button id="a">A<span id="aLabel">連打</span></button><button id="b">B<span id="bLabel">ジャンプ</span></button></div><div class="events" id="events"></div><div id="results"></div></div>
<script>
(()=>{'use strict';
const events=[['100m走','A・Bを交互に連打','time'],['1500m走','Aで走る・残り300mからBでスパート','time'],['110mハードル','A連打で走り、Bでジャンプ','time'],['走り幅跳び','A連打→踏切線でB。3回挑戦','length'],['ジャベボール投げ','A連打→B長押しで角度→離して投げる','length']];
const cv=document.querySelector('#screen'),c=cv.getContext('2d'),$=x=>document.querySelector(x),lim=(v,a,b)=>Math.max(a,Math.min(b,v));c.imageSmoothingEnabled=false;
let jumpStarted=-10,throwHeldStart=0,throwAge=0,throwOrigin=0;
let longJumpAge=0,longJumpOrigin=0;
const LONG_JUMP_SCALE=24,LONG_JUMP_LINE=326,LONG_JUMP_HOLD=1.2;
function longJumpDuration(){return .8+(records.at(-1)||0)*.065;}
function longJumpView(){
 const active=selected===3&&mode==='between',distance=records.at(-1)||0,valid=active&&distance>0;
 const u=valid?Math.min(1,longJumpAge/longJumpDuration()):0;
 const start=32+longJumpOrigin*7.1-18,end=LONG_JUMP_LINE+distance*LONG_JUMP_SCALE;
 const x=start+(end-start)*u,lift=4*u*(1-u)*(45+distance*2);
 const camera=valid?Math.max(0,x-230)*Math.min(1,longJumpAge/.35):0;
 return {active,valid,u,x,lift,camera,distance,landed:valid&&u===1};
}
// World-space metres keep the ball, camera, ground ruler and recorded distance aligned.
const JAVE_SCALE=7.1,JAVE_LINE=326,JAVE_GROUND=286,JAVE_LANDING_HOLD=1.2;
function javeFlightDuration(){return 1.2+(records.at(-1)||0)*.035;}
function javeFlightPoint(u){
 const distance=records.at(-1)||0,launch=32+throwOrigin*JAVE_SCALE+12;
 const end=JAVE_LINE+distance*JAVE_SCALE,arc=48+distance*.6;
 return {x:launch+(end-launch)*u,y:264+(JAVE_GROUND-6-264)*u-4*arc*u*(1-u)};
}
function javeView(){
 const active=selected===4&&mode==='between',u=active?Math.min(1,throwAge/javeFlightDuration()):0;
 const ball=javeFlightPoint(u),camera=active?Math.max(0,ball.x-230)*Math.min(1,throwAge/.45):0;
 return {active,u,ball,camera,landed:active&&u===1};
}
const DIFFICULTIES=[.78,.90,1,1.08,1.16];
let difficulty=2;
try{const saved=localStorage.getItem('athletics_difficulty');if(saved!==null&&/^[0-4]$/.test(saved))difficulty=Number(saved)}catch{}
$('#difficulty').value=String(difficulty);
$('#difficulty').onchange=()=>{if(mode!=='menu')return;difficulty=lim(Number($('#difficulty').value)||0,0,4);try{localStorage.setItem('athletics_difficulty',String(difficulty))}catch{}};
let fallenHurdles=new Map(),falseStartUntil=0;
function cpuPace(j,i,d){return (i===1?distancePace(j,d)*1.03:(i===0?5.1:11.4)*rivals[j].skill)*DIFFICULTIES[difficulty]}
function throwDistance(speed,degrees){return lim(4+speed*3.6*Math.max(0,Math.sin(degrees*Math.PI/90)),0,55)}
let uiState='';
let selected=0,mode='menu',cup=false,results=[],attempt=1,records=[],pos=0,spd=0,sta=100,last='',angle=42,bHeld=false,elapsed=0,prev=0,carry=0,deadline=0,invuln=0,hit=new Set(),feedback='',feedbackTime=0,downs=new Set();
let rivals=[{name:'CPU 1',color:'#53b4ee',dist:0,skill:1.02},{name:'CPU 2',color:'#ef7474',dist:0,skill:.96},{name:'CPU 3',color:'#78d99b',dist:0,skill:.91}],cpuRecords=[],cpuTotal=[0,0,0],currentRank=1,finishDashTime=0,finishDashRecord=0,finishDashSpeed=0,ceremonyTime=0,ceremonyRank=1,ceremonyTotal=false,ceremonyScores=[];
// Presentation only: each athlete has an independent, fixed-step animation clock.
const runnerMotion=Array.from({length:4},()=>({travel:0,age:0,frameTime:0,speed:0,moving:false}));
function resetRunnerMotion(){runnerMotion.forEach(m=>Object.assign(m,{travel:0,age:0,frameTime:0,speed:0,moving:false}))}
function advanceRunnerMotion(dt){
 const running=mode==='run'||mode==='finishDash';
 runnerMotion.forEach((m,i)=>{
  const travel=i===0?pos:rivals[i-1].dist,delta=Math.max(0,travel-m.travel);m.travel=travel;
  m.speed=running?delta/dt:0;m.moving=running&&m.speed>.03;
  if(!m.moving){m.age=0;m.frameTime=0;return;}
  m.age+=dt;
  // Crouching poses belong before the gun, never in the running cycle.
  const cycleDt=dt;
  const fps=Math.min(12,Math.max(6,6+m.speed*(selected===1?.22:.6)));
  m.frameTime=(m.frameTime+cycleDt*fps)%24;
 });
}
let audioContext=null,soundEnabled=true;
async function unlockStartAudio(){
 if(!soundEnabled)return;
 try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;audioContext??=new Audio();if(audioContext.state==='suspended')await audioContext.resume().catch(()=>{});}catch{}
}
function playStartCue(phase){
 if(!soundEnabled||!audioContext||audioContext.state!=='running')return;
 const ctx=audioContext,t=ctx.currentTime,gain=ctx.createGain();gain.connect(ctx.destination);
 if(phase===2){
  const length=Math.floor(ctx.sampleRate*.18),buffer=ctx.createBuffer(1,length,ctx.sampleRate),data=buffer.getChannelData(0);
  for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*(1-i/length);
  const source=ctx.createBufferSource(),filter=ctx.createBiquadFilter();filter.type='highpass';filter.frequency.value=700;source.buffer=buffer;source.connect(filter);filter.connect(gain);
  gain.gain.setValueAtTime(.22,t);gain.gain.exponentialRampToValueAtTime(.001,t+.18);source.start(t);source.stop(t+.19);
 }else{
  const tone=ctx.createOscillator();tone.type='sine';tone.frequency.value=phase===0?440:660;tone.connect(gain);
  gain.gain.setValueAtTime(.001,t);gain.gain.exponentialRampToValueAtTime(.12,t+.01);gain.gain.exponentialRampToValueAtTime(.001,t+.16);tone.start(t);tone.stop(t+.17);
 }
}
$('#sound').onclick=()=>{soundEnabled=!soundEnabled;$('#sound').textContent='音：'+(soundEnabled?'ON':'OFF');$('#sound').setAttribute('aria-pressed',String(soundEnabled));if(soundEnabled){unlockStartAudio();}};
// Opening presentation stays separate from competition state and controls.
let openingPage='title',storyIndex=0,storyChars=0,storyElapsed=0;
const storyPages=[
 {heading:'ライバルが、待っている。',text:'スタジアムに、歓声がひびく。\n黄色のユニフォームをまとったあなたの前に、\n3人のライバルが集まった。'},
 {heading:'5つの競技に、挑もう。',text:'100m、1500m、ハードル。\n走り幅跳び、そしてジャベボール投げ。\n速さとタイミングで、5つの競技に挑もう。'},
 {heading:'さあ、スタートラインへ。',text:'自分のベストを、ひとつずつ超えていこう。\n最後の一歩まで、あきらめずに。\nキミの挑戦が、いま始まる！'}
];
const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
function showOpening(page){
 openingPage=page;downs.clear();bHeld=false;for(const el of document.querySelectorAll('.pads button'))el.classList.remove('active');
 $('#opening').hidden=page==='game';$('#gameView').hidden=page!=='game';
 $('#titleView').hidden=page!=='title';$('#titleActions').hidden=page!=='title';$('#storyView').hidden=page!=='story';$('#storyActions').hidden=page!=='story';
 window.scrollTo(0,0);
 if(page==='title')$('#openingStart').focus({preventScroll:true});
 if(page==='game'){uiState='';syncUI();prev=performance.now();carry=0;}
}
function showStory(index){
 storyIndex=index;storyChars=0;storyElapsed=0;showOpening('story');
 $('#storyCount').textContent='STORY 0'+(index+1)+' / 03';$('#storyHeading').textContent=storyPages[index].heading;
 $('#storyAccessible').textContent=storyPages[index].text;updateStoryText(storyPages[index].text.length);$('#storyNext').focus({preventScroll:true});
}
function updateStoryText(count){storyChars=count;$('#storyText').textContent=storyPages[storyIndex].text.slice(0,count);$('#storyNext').textContent=count<storyPages[storyIndex].text.length?'全文を表示':storyIndex===2?'競技を選ぶ ▶':'次へ ▶';}
function drawOpening(t,dt){
 if(openingPage==='story'&&storyChars<storyPages[storyIndex].text.length){storyElapsed+=dt;const count=Math.min(storyPages[storyIndex].text.length,Math.floor(storyElapsed/.04));if(count>storyChars)updateStoryText(count);}
 const ctx=$('#openingArt').getContext('2d');ctx.imageSmoothingEnabled=false;
 const box=(x,y,w,h,col)=>{ctx.fillStyle=col;ctx.fillRect(x,y,w,h)};
 box(0,0,384,152,'#274b60');box(0,21,384,44,'#284f4e');
 for(let i=0;i<72;i++)box((i*37)%384,27+Math.floor(i/24)*11,3,3,['#efd685','#a5c4bb','#769593'][i%3]);
 box(0,67,384,5,'#e8dcc0');box(0,72,384,80,'#a94e3e');for(let y=85;y<152;y+=25)box(0,y,384,2,'#d5b294');box(20,72,3,80,'#f9f4db');
 if(!spriteReady)return;
 const running=openingPage==='title'||storyIndex===1;
 for(let i=0;i<4;i++){
  const frame=running&&!reducedMotion.matches?Math.floor(t/125+i*2)%8:0,row=running?2:storyIndex===2?4:0;
  ctx.drawImage(spriteVariants[i][row],frame*48,0,48,48,40+i*82,82-(running&&frame%4===3?2:0),48,48);
  ctx.fillStyle=['#ffdb65','#74ccf5','#fb8476','#7edc9b'][i];ctx.font='bold 8px monospace';ctx.textAlign='center';ctx.fillText(i?'CPU '+i:'YOU',64+i*82,145);
 }
}
$('#openingStart').onclick=()=>{unlockStartAudio();showStory(0)};
$('#storyNext').onclick=()=>{if(storyChars<storyPages[storyIndex].text.length)updateStoryText(storyPages[storyIndex].text.length);else if(storyIndex<2)showStory(storyIndex+1);else showOpening('game')};
$('#storySkip').onclick=()=>showOpening('game');

let spurtUsed=false,spurtActive=false;
let startPhase=0; // 0: on your marks, 1: set; only used before the gun.
let best={};try{best=JSON.parse(localStorage.getItem('athletics_bests_pace_v2')||localStorage.getItem('athletics_bests_v1')||'{}')}catch{}
// Keep legacy bests archived; only 1500m has new race rules.
try{const saved=localStorage.getItem('athletics_1500_pace_v2');delete best[1];if(saved!==null&&Number.isFinite(+saved))best[1]=+saved}catch{delete best[1]}
const message=s=>$('#msg').textContent=s;
const guides=[
['AとBを交互に！','A → B → A → B と交互に連打。','同じボタンを続けて押しても加速しません。','交互連打','交互連打'],
['ペース配分とラストスパート！','Aでペース維持。残り300mからBでスパート。','スタミナを温存。Bは1回だけ。','走る','スパート'],
['ハードル直前でジャンプ！','Aで走る。ハードルの直前にBでジャンプ。','黄色の合図が出たらB！早すぎても遅すぎても減速します。','走る','ジャンプ'],
['黄色い踏切線でジャンプ！','A連打で助走。踏切線の直前でBを押します。','黄色い線を越えるとファウル。3回挑戦できます。','助走','踏切'],
['角度を決めて投げよう！','A連打で助走。Bを押し続けて角度を調整し、離して投げます。','0〜90°で調整。45°が狙い目。3回挑戦。','助走','長押し→離す']
];
function guide(){const g=guides[selected];$('#help').textContent='操作：A＝'+g[3]+' ／ B＝'+g[4];$('#aLabel').textContent=g[3];$('#bLabel').textContent=g[4];$('#tutorialTitle').textContent=events[selected][0]+' の遊び方';$('#tutorialText').textContent=g[1];$('#tutorialHint').textContent=g[2]}
function showGuide(){$('#resultPanel').hidden=true;ceremonyTime=0;mode='tutorial';guide();$('#tutorial').hidden=false;message('操作説明を確認してください');$('#start').textContent='START';syncUI()}
function begin(){ if(!spriteReady)return;$('#resultPanel').hidden=true;$('#tutorial').hidden=true;cpuRecords=[];resetRun();unlockStartAudio().then(()=>{if(selected<3&&mode==='ready'&&startPhase===0)playStartCue(0)});attempt=1;records=[];mode='ready';deadline=performance.now()+3000;message(selected<3?'On your marks — 位置について':'READY ...');syncUI()}
$('#tutorialGo').onclick=begin;
// Bests and scoring retain simulation seconds (v1); convert only at presentation.
// Distance-weighted offsets start at zero and keep the virtual clock continuous.
const RACE_CLOCKS=[[12,.2],[390,4],[20,.5]];
function raceSeconds(i,seconds,progress=1){const [course,rate]=RACE_CLOCKS[i];return course*lim(progress,0,1)+seconds*rate}
function timeText(i,seconds){const ticks=Math.round(seconds*100);return i===1?Math.floor(ticks/6000)+':'+(Math.floor(ticks/100)%60).toString().padStart(2,'0')+'.'+(ticks%100).toString().padStart(2,'0'):(ticks/100).toFixed(2)}
const label=(i,v)=>events[i][2]==='time'?timeText(i,raceSeconds(i,v))+(i===1?'':'秒'):v.toFixed(2)+'m';
function points(i,v){return Math.round(lim(i===0?(42-v)/27:i===1?(110-v)/65:i===2?(45-v)/28:i===3?(v-1)/6:(v-4)/46,0,1)*1000)}
function resetRun(){fallenHurdles.clear();falseStartUntil=0;spurtUsed=false;spurtActive=false;startPhase=0;resetRunnerMotion();jumpStarted=-10;longJumpAge=0;longJumpOrigin=0;throwHeldStart=0;throwAge=0;throwOrigin=0;ceremonyTime=0;finishDashTime=0;finishDashRecord=0;finishDashSpeed=0;rivals.forEach(r=>r.dist=0);currentRank=1;pos=0;spd=0;sta=100;last='';bHeld=false;angle=42;elapsed=0;invuln=0;hit.clear();feedback=''}
function select(i){if(['run','ready','finishDash','ceremony'].includes(mode))return;selected=i;cup=false;mode='menu';resetRun();$('#resultPanel').hidden=true;$('#tutorial').hidden=true;render();message(events[i][0]+' を選択しました')}
function render(){ $('#events').replaceChildren();events.forEach((e,i)=>{const b=document.createElement('button');b.textContent=e[0];b.setAttribute('aria-label',e[0]);const meta=document.createElement('span');meta.textContent=best[i]==null?'PLAY →':'BEST '+label(i,best[i]);b.appendChild(meta);b.className=i===selected?'selected':'';b.onclick=()=>{select(i);showGuide();syncUI()};$('#events').appendChild(b)});guide();const rows=results.map(r=>'<tr><td>'+events[r.i][0]+'</td><td>'+label(r.i,r.v)+'</td><td>'+r.p+'点</td></tr>').join('');$('#results').innerHTML='<p>自己ベスト：'+(best[selected]==null?'—':label(selected,best[selected]))+'</p>'+(results.length?'<table><tr><th>競技</th><th>記録</th><th>得点</th></tr>'+rows+'<tr><th>合計</th><th>'+results.length+'/5</th><th>'+results.reduce((s,r)=>s+r.p,0)+'点</th></tr></table>':'')}
function start(){showGuide()}
function input(k){
 if(mode==='ready'&&selected<3){
  const now=performance.now();
  if(now>=deadline)step(0,now);
  else{resetRun();mode='falseStart';falseStartUntil=now+1200;message('フライング！ 再スタート');playStartCue(0);syncUI();return;}
 }
 if(mode!=='run')return;if(selected===4&&k==='B'){if(!bHeld){throwHeldStart=elapsed;angle=0;}bHeld=true;return}
if(selected===0){if(k!==last){spd=lim(spd+1.6,0,13.5);last=k;flash('SPEED UP!')}else spd=Math.max(0,spd-.5);return}
if(selected===1&&k==='B'){if(spurtUsed){flash('スパート使用済み');return}if(pos<120){flash('残り300mから！');return}if(sta<8){flash('スタミナ不足！');return}spurtUsed=true;spurtActive=true;flash('ラストスパート！');return}
if(k==='A'){if(selected===1){spd=lim(spd+(sta>8?1.15:.12),0,11.5);sta=lim(sta-1.8,0,100)}else spd=lim(spd+1.3,0,12.5);return}
if(selected===2&&k==='B'){let next=12+Math.ceil(Math.max(0,pos-12)/10)*10,delta=next-pos;if(delta>=0&&delta<4.6){jumpStarted=elapsed;invuln=elapsed+.44;flash(delta<2?'PERFECT!':'GOOD!')}else flash('TOO EARLY!')}
if(selected===3&&k==='B')finishAttempt()}

if(selected<3){let spacing=selected===1?12.5:selected===2?10:25;for(let d=spacing;d<goal;d+=spacing){let mx=54+(d-cam)*scale;if(mx>15&&mx<370){rect(mx,77,1,211,selected===1?'#e5b97d':'#e8c99b');let meter=selected===1?Math.round(d*10):Math.round(d);if(selected!==1||meter%250===0)txt(meter+'m',mx+3,298,10,'#fff4d3')}}}
if(selected===2)for(let i=0;i<10;i++){
 const h=54+(12+i*10-cam)*scale;
 if(h>-24&&h<400){
  for(let lane=0;lane<4;lane++){
   const y=105+lane*53,fall=lane===3?fallenHurdles.get(i):undefined;
   if(fall===undefined)drawProp(1,h-7,y);
   else{const u=lim((elapsed-fall)/.32,0,1);c.save();c.translate(Math.round(h-7),y+22);c.rotate(u*Math.PI/2);drawProp(1,0,-22);c.restore();}
  }
  const delta=12+i*10-pos;
  if(mode==='run'&&delta>=0&&delta<4.6)txt('B!',h,230,12,'#ffdb65','center');
 }
}
if(selected===3){drawLongJumpField();x-=longJumpView().camera;}
if(selected===4){drawJaveField();x-=javeView().camera;}
let y=241;if(selected===3&&longJumpView().valid)drawLongJumpAthlete();else drawRunnerSprite(x,y,pos,mode,4);drawJaveBallFlight();if(selected<3)txt('YOU',Math.max(2,x+1),y-4,9,'#ffdb65');
if(mode==='run'&&selected<3&&elapsed<.7)txt('ドン！',192,164,24,'#ffdb65','center');
if(mode==='finishDash')txt('GOAL! →',192,69,18,'#ffdb65','center');if(selected===1){rect(106,44,172,11,'#111b2b');rect(106,44,172*sta/100,11,sta<25?'#e46b64':'#75df9c');txt(feedback&&elapsed<feedbackTime?feedback:spurtActive?'SPURT!':spurtUsed?'スパート使用済み':pos>=120?'B：スパート！':'B：残り300mから',8,69,11,spurtActive||pos>=120?'#ffdb65':'#fff')}if(selected===2){txt('HURDLE '+Math.min(10,hit.size+1)+'/10',8,69,11,'#ffdb65')}if(selected===0&&mode==='run')txt('NEXT: '+(last==='A'?'B':'A'),186,66,14,'#ffdb65','center');if(selected===4&&bHeld)drawAngleGauge();if(selected!==1&&feedback&&elapsed<feedbackTime)txt(feedback,8,56,10,'#ffdb65','left');
if(mode!=='run'&&mode!=='finishDash'&&mode!=='ceremony'&&!(selected>=3&&mode==='between')){rect(78,134,232,61,'#0d1420');rect(82,138,224,53,'#3c5776');txt(mode==='falseStart'?'FALSE START!':mode==='menu'?'SELECT & START':mode==='tutorial'?'HOW TO PLAY':mode==='ready'?(selected<3?(startPhase?'SET':'ON YOUR MARKS'):'READY ...'):mode==='between'?'NEXT ATTEMPT':mode==='finished'?'TOURNAMENT END':'FINISH!',192,164,16,'#ffdb65','center');txt(mode==='falseStart'?'フライング！ 再スタート':mode==='finished'?results.reduce((s,r)=>s+r.p,0)+'/5000':mode==='ready'?(selected<3?(startPhase?'用意':'位置について'):'選手は GO で走り出す'):mode==='menu'?'A / B BUTTONS':'8BIT ATHLETICS',192,184,10,'#fff','center')}}
function drawTapeBurst(t){

 rect(0,35,384,285,'#16233a');

 }

function syncUI(){
 const key=mode+':'+selected+':'+cup;if(key===uiState)return;uiState=key;
 const menu=mode==='menu',tutorial=mode==='tutorial',result=mode==='result'||mode==='finished',race=['ready','run','between','finishDash'].includes(mode);
 $('#gameView').setAttribute('data-screen',menu?'menu':tutorial?'tutorial':result?'result':'race');
 $('#difficultyControl').hidden=!menu;$('#screen').hidden=menu||tutorial||result;$('#menuTitle').hidden=!menu;$('#events').hidden=!menu;
 document.querySelector('.pads').hidden=!['ready','run','between'].includes(mode);
 $('#start').hidden=!result;$('#cup').hidden=!menu;$('#reset').hidden=!menu;$('#menuBack').hidden=!(tutorial||result);$('#skipCeremony').hidden=mode!=='ceremony';
 $('#help').hidden=true;$('#msg').hidden=true;$('#results').hidden=true;$('#resultHint').hidden=true;
 if(menu)$('#cup').textContent='5種競技大会';
 if(openingPage==='game'){
  window.scrollTo(0,0);
  const target=menu?'#menuTitle':tutorial?'#tutorialTitle':result?'#resultHeading':race?'#screen':null;
  if(target)$(target).focus({preventScroll:true});
 }
}
$('#menuBack').onclick=()=>{cup=false;results=[];cpuTotal=[0,0,0];mode='menu';resetRun();$('#tutorial').hidden=true;$('#resultPanel').hidden=true;render();syncUI()};
$('#skipCeremony').onclick=()=>{if(mode!=='ceremony')return;ceremonyTime=3.7;step(0,performance.now())};
function loop(t){const dt=Math.min((t-prev||16)/1000,.05);prev=t;if(openingPage!=='game'){drawOpening(t,dt);requestAnimationFrame(loop);return;}carry+=dt;let n=0;while(carry>=1/60&&n++<4){step(1/60,t);carry-=1/60}draw(t);if(mode==='finishDash')drawTapeBurst(t);if(mode==='ceremony')drawCeremony(t);requestAnimationFrame(loop)}
$('#start').onclick=()=>{if(!spriteReady||mode==='finishDash'||mode==='ceremony')return;if(cup&&mode==='result'&&results.length<5){selected=results.length;render();start()}else if(cup&&mode==='finished'){results=[];cpuTotal=[0,0,0];selected=0;render();start()}else if(mode==='result'){begin()}else start()};
$('#cup').onclick=()=>{if(!spriteReady||mode==='finishDash'||mode==='ceremony')return;cup=true;selected=0;results=[];cpuTotal=[0,0,0];$('#start').textContent='次の種目へ';render();start()};
$('#reset').onclick=()=>{$('#start').disabled=!spriteReady;$('#cup').disabled=!spriteReady;$('#resultPanel').hidden=true;$('#tutorial').hidden=true;cup=false;results=[];cpuTotal=[0,0,0];mode='menu';resetRun();$('#start').textContent='START';render();message('競技を選んでSTART！');showOpening('title')};
for(const k of ['a','b']){const el=$('#'+k),K=k.toUpperCase();el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch{}el.classList.add('active');input(K)});for(const event of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(event,e=>{e.preventDefault();el.classList.remove('active');release(K)})}
document.addEventListener('keydown',e=>{if(openingPage!=='game')return;let k=e.key.toUpperCase();if(!['A','B'].includes(k))return;e.preventDefault();if(downs.has(k))return;downs.add(k);$('#'+k.toLowerCase()).classList.add('active');input(k)});
document.addEventListener('keyup',e=>{let k=e.key.toUpperCase();if(!['A','B'].includes(k))return;downs.delete(k);$('#'+k.toLowerCase()).classList.remove('active');release(k)});
window.addEventListener('blur',()=>{downs.clear();bHeld=false;for(const e of document.querySelectorAll('.pads button'))e.classList.remove('active')});
syncUI();render();requestAnimationFrame(loop);
})();

<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>換算タイム確認</title>
<style>body{background:#172337;color:#fff4d3;font:16px system-ui;padding:16px}iframe{width:100%;max-width:900px;height:1000px;border:0}button,select{font:inherit;padding:10px;margin:5px}pre{white-space:pre-wrap}</style>
<h1>換算タイム確認</h1><p>実際のゲーム描画と結果画面を、固定条件で確認します。</p><select id="event"><option value="0">100m</option><option value="1">1500m</option><option value="2">ハードル</option></select><button id="goal">ゴール</button><button id="result">結果画面</button><button id="checks">検証</button><pre id="status">読込中</pre><div id="mount"></div>
<script type="module">
const html=await(await fetch('../index.html')).text(),probe=await(await fetch('./time-probe.js')).text(),frame=document.createElement('iframe');frame.srcdoc=html.replace('<head>','<head><base href="'+new URL('../',location.href).href+'">').replaceAll('localStorage','qaStorage').replace("(()=>{'use strict';","(()=>{'use strict';const qaStorage={getItem:()=>null,setItem:()=>{}};").replace('render();requestAnimationFrame(loop);',probe+'\nrender();');document.querySelector('#mount').append(frame);
await new Promise(resolve=>{const id=setInterval(()=>{if(frame.contentWindow.timeQA?.ready()){clearInterval(id);resolve()}},50)});
const qa=frame.contentWindow.timeQA,event=()=>+document.querySelector('#event').value;
document.querySelector('#goal').onclick=()=>qa.scene(event());document.querySelector('#result').onclick=()=>qa.result(event());document.querySelector('#checks').onclick=()=>{try{document.querySelector('#status').textContent='PASS '+qa.checks().count+' assertions'}catch(e){document.querySelector('#status').textContent='FAIL '+e.message}};document.querySelector('#status').textContent='PNG読込完了';qa.scene();
</script></html>

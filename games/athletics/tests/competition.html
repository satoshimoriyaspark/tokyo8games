<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>競技アップデート確認</title>
<style>body{background:#172337;color:#fff4d3;font:16px system-ui;padding:16px}iframe{width:100%;max-width:900px;height:1000px;border:0}button,select{font:inherit;padding:10px;margin:5px}pre{white-space:pre-wrap}</style>
<h1>競技アップデート確認</h1><button id="menu">難易度メニュー</button><button id="false">フライング</button><button id="hurdle">衝突直後</button><button id="fall">転倒途中</button><button id="down">転倒後</button><button id="angle">角度45°</button><button id="zero">角度0°</button><button id="ninety">角度90°</button><button id="checks">検証</button><button id="clean">ノーミス試走</button><button id="onehit">1回衝突で試走</button><button id="threehits">3回衝突で試走</button><pre id="status">読込中</pre><label>画面幅 <select id="viewport"><option value="900">PC</option><option value="390">390px</option><option value="820">820px</option></select></label><div id="mount"></div>
<script type="module">
const html=await(await fetch('../index.html')).text(),probe=await(await fetch('./competition-probe.js')).text(),frame=document.createElement('iframe');frame.srcdoc=html.replace('<head>','<head><base href="'+new URL('../',location.href).href+'">').replaceAll('localStorage','qaStorage').replace("(()=>{'use strict';","(()=>{'use strict';const qaStorage={getItem:()=>null,setItem:()=>{}};").replace('render();requestAnimationFrame(loop);',probe+'\nrender();');document.querySelector('#mount').append(frame);document.querySelector('#viewport').onchange=e=>{frame.style.width=e.target.value+'px';frame.style.height=(e.target.value==='390'?844:e.target.value==='820'?1180:1000)+'px'};
await new Promise(resolve=>{const id=setInterval(()=>{if(frame.contentWindow.competitionQA?.ready()){clearInterval(id);resolve()}},50)});
const qa=frame.contentWindow.competitionQA;
for(const [id,kind,value] of [['menu','menu',0],['false','false',0],['hurdle','hurdle',0],['fall','hurdle',.16],['down','hurdle',.5],['angle','angle',45],['zero','angle',0],['ninety','angle',90]])document.querySelector('#'+id).onclick=()=>qa.scene(kind,value);
for(const [id,misses] of [['clean',0],['onehit',1],['threehits',3]])document.querySelector('#'+id).onclick=()=>qa.demo(misses);
document.querySelector('#checks').onclick=()=>{try{document.querySelector('#status').textContent=(()=>{const r=qa.checks();return 'PASS '+r.count+' assertions\n'+JSON.stringify(r.balance,null,2)})()}catch(e){document.querySelector('#status').textContent='FAIL '+e.message}};document.querySelector('#status').textContent='PNG読込完了';qa.scene();
</script></html>

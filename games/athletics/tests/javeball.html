<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ジャベボール｜助走と着地点の確認</title>
<style>body{margin:0;padding:18px;background:#172337;color:#fff4d3;font:15px/1.6 system-ui}h1{font-size:24px;margin:0}button,select{font:inherit;padding:8px;margin:4px}iframe{display:none}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:1250px}canvas{width:100%;image-rendering:pixelated;display:block}h2{font-size:18px;margin:10px 0}pre{white-space:pre-wrap}.info{min-height:26px;color:#9deac4}a{color:#9cdefa}@media(max-width:600px){.pair{grid-template-columns:1fr}}</style>
<h1>ジャベボール｜走る助走・カメラ追従・距離目盛り</h1>
<p>左：修正前 ／ 右：修正後。同じPNG・助走位置・投球記録で比較。実際のゲーム描画を使用。</p>
<label>場面 <select id="scene"><option value="run">助走</option><option value="hold">角度調整中の助走</option><option value="flight0">リリース</option><option value="flight25">飛行25%</option><option value="flight50">飛行50%</option><option value="flight75">飛行75%</option><option value="land">着地</option></select></label>
<label>走行コマ <select id="frame"></select></label>
<button id="play">3回の試技を自動再生</button><button id="pause">一時停止</button><button id="checks">動作検証</button>
<div class="pair"><section><h2>修正前</h2><div class="info" id="oldInfo"></div><canvas id="old" width="384" height="320"></canvas><canvas id="oldZoom" width="64" height="52"></canvas></section><section><h2>修正後</h2><div class="info" id="newInfo"></div><canvas id="new" width="384" height="320"></canvas><canvas id="newZoom" width="64" height="52"></canvas></section></div>
<p><a href="../index.html">ゲームを開く</a> ／ <a href="./visual.html">全競技の回帰検証</a></p><pre id="result">読込中…</pre>
<script type="module">
const $=s=>document.querySelector(s),frames=[],probe=await(await fetch('./javeball-probe.js')).text();
for(const path of ['./javeball-baseline/index.html','../index.html']){
 const html=await(await fetch(path)).text(),base=new URL('../',location.href).href,f=document.createElement('iframe');
 f.srcdoc=html.replace('<head>','<head><base href="'+base+'">').replaceAll('localStorage','qaStorage').replace("(()=>{'use strict';","(()=>{'use strict';const qaStorage={getItem:()=>null,setItem:()=>{}};").replace('render();requestAnimationFrame(loop);',probe+'\nrender();');document.body.append(f);frames.push(f);
}
const apis=()=>frames.map(f=>f.contentWindow.javeQA);
await new Promise((resolve,reject)=>{const start=Date.now(),timer=setInterval(()=>{if(apis().every(a=>a?.ready())){clearInterval(timer);resolve()}else if(Date.now()-start>30000){clearInterval(timer);reject(Error('PNG timeout'))}},50)});
for(let i=0;i<8;i++)$('#frame').add(new Option(String(i+1),i));
function paint(r,i){
 const id=i?'new':'old',ctx=$('#'+id).getContext('2d');ctx.imageSmoothingEnabled=false;ctx.drawImage(r.canvas,0,0);
 const z=$('#'+id+'Zoom').getContext('2d');z.imageSmoothingEnabled=false;z.fillStyle='#172337';z.fillRect(0,0,64,52);
 if(r.mode!=='between')z.drawImage(r.canvas,r.anchor.dx-8,237,64,52,0,0,64,52);
 $('#'+id+'Zoom').hidden=r.mode==='between';
 $('#'+id+'Info').textContent='試技 '+r.attempt+' / '+r.mode+(r.view?.active?' / '+(r.view.landed?'着地':Math.floor(r.view.u*100)+'%'):'');
}
let playing=false,carry=0,last=0;
function scene(){playing=false;const value=$('#scene').value;apis().forEach((a,i)=>paint(a.scene(value.startsWith('flight')?'flight':value,value.startsWith('flight')?Number(value.slice(6))/100:+$('#frame').value),i));}
$('#scene').onchange=scene;$('#frame').onchange=scene;
$('#play').onclick=()=>{apis().forEach(a=>a.start());playing=true;carry=0};$('#pause').onclick=()=>{playing=!playing};
$('#checks').onclick=()=>{playing=false;try{const r=apis()[1].checks();$('#result').textContent='PASS '+r.count+' assertions\n'+r.passed.join('\n')}catch(e){$('#result').textContent='FAIL '+e.stack}scene()};
function loop(t){const dt=last?Math.min((t-last)/1000,.1):0;last=t;if(playing){carry+=dt;while(carry>=1/60){apis().forEach((a,i)=>paint(a.tick(),i));carry-=1/60;}}requestAnimationFrame(loop);}
$('#result').textContent='PNG読込完了。画面はChromeによる確認用です。';scene();requestAnimationFrame(loop);
</script></html>

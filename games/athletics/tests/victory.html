<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>8BIT ATHLETICS｜バンザイ確認</title>
<style>body{margin:0;padding:20px;background:#101927;color:#fff4da;font:16px/1.5 system-ui}h1{font-size:24px}h2{font-size:18px}a{color:#94dfff}button{padding:10px;font:inherit;margin:3px}canvas{image-rendering:pixelated;max-width:100%}.pair{display:flex;gap:24px;flex-wrap:wrap}.sheet{width:576px}iframe{display:none}#scene{width:384px;border:2px solid #d8d7bd}#status{color:#aaf2b5}</style>
<h1>バンザイ｜左右の腕と上げ下げを確認</h1>
<p>各シートは「曲げる・バンザイ・下ろす」。上段は暗い背景、下段は明るい背景。</p>
<div class="pair"><section><h2>修正前</h2><canvas id="before" class="sheet" width="144" height="96"></canvas></section><section><h2>修正後</h2><canvas id="after" class="sheet" width="144" height="96"></canvas></section></div>
<p><button id="play">演出を再生</button><button id="lower">下ろす</button><button id="bend">曲げて上げる</button><button id="raise">バンザイ</button><a href="../index.html">ゲームを開く</a></p>
<div class="pair"><canvas id="scene" width="384" height="320"></canvas><p id="status">PNG読込中…</p></div>
<script type="module">
const $=s=>document.querySelector(s);
for(const [id,url] of [['before','./evidence/victory-before.png'],['after','../assets/sprites/cute_v2/victory_front.png']]){
 const img=new Image();img.src=url;await img.decode();const c=$('#'+id).getContext('2d');c.imageSmoothingEnabled=false;
 ['#172237','#fff4dc'].forEach((bg,i)=>{c.fillStyle=bg;c.fillRect(0,i*48,144,48);c.drawImage(img,0,i*48)});
}
const source=await(await fetch('../index.html')).text(),probe=await(await fetch('./probe.js')).text(),f=document.createElement('iframe');
f.srcdoc=source.replace('<head>','<head><base href="'+new URL('../',location.href).href+'">').replaceAll('localStorage','qaStorage').replace("(()=>{'use strict';","(()=>{'use strict';const qaStorage={getItem:()=>null,setItem:()=>{}};").replace('render();requestAnimationFrame(loop);',probe+'\nrender();');document.body.append(f);
await new Promise((resolve,reject)=>{const start=Date.now(),id=setInterval(()=>{if(f.contentWindow.qa?.ready()){clearInterval(id);resolve()}else if(Date.now()-start>30000){clearInterval(id);reject(Error('PNG timeout'))}},50)});
const qa=f.contentWindow.qa,c=$('#scene').getContext('2d');c.imageSmoothingEnabled=false;let timer;
function show(p){qa.scene({mode:'ceremony',ceremony:p});c.drawImage(qa.paint(),0,0);$('#status').textContent='読込完了 / 実ゲーム描画 / 演出 '+p.toFixed(2)+'秒';}
function hold(p){clearInterval(timer);show(p)}
$('#lower').onclick=()=>hold(.05);$('#bend').onclick=()=>hold(.25);$('#raise').onclick=()=>hold(.45);
$('#play').onclick=()=>{clearInterval(timer);let start=performance.now();timer=setInterval(()=>show(((performance.now()-start)/1000)%1.25),1000/30)};
show(.45);
</script></html>

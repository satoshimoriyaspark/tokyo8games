<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BGM確認</title><style>body{font:16px system-ui;background:#172337;color:#fff;padding:16px}button{padding:10px;margin:4px}iframe{width:100%;max-width:900px;height:800px;border:0}pre{white-space:pre-wrap}</style><h1>8BIT ATHLETICS BGM確認</h1><p>音源を有効にするにはボタンを押してください。競技記録は保存しません。playingはエンジン状態で、実スピーカーの確認とは異なります。</p><div id="buttons"></div><pre id="status">ロード中</pre><div id="mount"></div><a href="../index.html">ゲームを開く</a><script type="module">
const html=await(await fetch('../index.html')).text(),probe=await(await fetch('./audio-probe.js')).text(),frame=document.createElement('iframe');frame.srcdoc=html.replace('<head>','<head><base href="'+new URL('../',location.href).href+'">').replaceAll('localStorage','qaStorage').replace("(()=>{'use strict';","(()=>{'use strict';const qaStorage={getItem:()=>null,setItem:()=>{}};").replace('render();requestAnimationFrame(loop);',probe+'\nrender();');document.querySelector('#mount').append(frame);
for(const [kind,label] of [['opening','タイトル'],['menu','種目選択（継続）'],['ready','READY（停止）'],['go','GO（競技曲）'],['goal','ゴール（停止）'],['result','通常結果'],['champion','1位'],['record','新記録'],['both','1位＋新記録'],['retry','再挑戦'],['mute','音声ON/OFF']]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>frame.contentWindow.audioQA?.scene(kind);document.querySelector('#buttons').append(b)}setInterval(()=>{const qa=frame.contentWindow.audioQA;if(qa?.ready())document.querySelector('#status').textContent=JSON.stringify(qa.report(),null,2)},200);
</script></html>

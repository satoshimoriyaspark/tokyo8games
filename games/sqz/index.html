<script>

function allowed(q){if(q.status!=='verified')return false;if(q.category!=='emblems')return true;const a=ASSETS[q.assetId];return !!(a&&a.status==='approved'&&a.gameUse===true&&a.evidence&&a.checkedAt&&(!a.expiresAt||a.expiresAt>=new Date().toISOString().slice(0,10)));}
const BANK=DB.filter(allowed),MAP=new Map(BANK.map(q=>[q.id,q]));
function fresh(){return {version:1,sound:false,flags:true,total:0,correct:0,bestStreak:0,mistakes:[],seen:[],cups:{},active:null};}
let P=fresh(),storageOK=true,loadMessage='';
try{const raw=localStorage.getItem(KEY);if(raw){const x=JSON.parse(raw);if(x.version!==1)throw Error('version');P={...fresh(),...x};for(const k of ['mistakes','seen'])P[k]=Array.isArray(x[k])?[...new Set(x[k].filter(id=>MAP.has(id)))]:[];for(const k of ['total','correct','bestStreak'])P[k]=Number.isFinite(x[k])&&x[k]>=0?Math.floor(x[k]):0;P.cups=x.cups&&typeof x.cups==='object'&&!Array.isArray(x.cups)?x.cups:{};P.sound=x.sound===true;P.flags=x.flags!==false;const s=P.active;if(s&&(!['cup','training','review'].includes(s.kind)||!Array.isArray(s.ids)||s.ids.length<1||s.ids.length>10||new Set(s.ids).size!==s.ids.length||s.ids.some(id=>!MAP.has(id))||!Number.isInteger(s.i)||s.i<0||s.i>=s.ids.length||!Array.isArray(s.picks)||s.picks.length<s.i||s.picks.length>s.i+1||s.picks.some((a,i)=>a!==null&&!MAP.get(s.ids[i]).choices.includes(a))||![1,2,3].includes(s.diff)||![0,1,2].includes(s.stage))){P.active=null;loadMessage='途中データを読み込めなかったため、メニューに戻りました。記録は保持しています。';}if(P.active)P.active.ms=Math.max(0,Math.min(20000,Number(P.active.ms)||0));}}
catch(e){P=fresh();loadMessage='保存データを読み込めなかったため、初期状態で開始します。';}
let S=P.active,view='home',diff=1,category='all',timer=null,lastTick=0,lastSave=0,audio=null,shot=null;
const soundNodes=new Set(), crowdBuffers=new Map();
let soundGeneration=0;
function silence(){soundGeneration++;for(const node of soundNodes){try{node.stop();}catch(e){}}soundNodes.clear();}

function save(){P.active=S;try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){storageOK=false;notify('このブラウザでは記録を保存できません。ページを閉じると進行状況が失われます。');}}
function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function cup(d){let c=P.cups[d];if(!c||![0,1,2].includes(c.stage)||!Array.isArray(c.used)||!Array.isArray(c.scores)){c={stage:0,used:[],scores:[],wins:0,best:0};P.cups[d]=c;}c.used=c.used.filter(id=>MAP.has(id));c.wins=Number.isFinite(c.wins)?c.wins:0;c.best=Number.isFinite(c.best)?c.best:0;return c;}
function selectQuestions(d,cat,excluded=[],review=false){let pool=BANK.filter(q=>(P.flags||q.category!=='flags')&&(review?P.mistakes.includes(q.id):q.level<=d)&&(cat==='all'||q.category===cat));const block=new Set(excluded);pool=pool.filter(q=>!block.has(q.id));const seen=new Set(P.seen);const rank=new Map(pool.map(q=>[q.id,(seen.has(q.id)?0:100)+(q.level===d?4:0)+Math.random()*3]));const selected=[],groups={};for(const q of pool)(groups[q.category]??=[]).push(q);for(const g of Object.values(groups))g.sort((a,b)=>rank.get(b.id)-rank.get(a.id));while(selected.length<10){let added=false;for(const k of shuffle(Object.keys(groups))){if(selected.length===10)break;const q=groups[k].shift();if(q){selected.push(q.id);added=true;}}if(!added)break;}return shuffle(selected);}
function stop(){if(timer){clearInterval(timer);timer=null;}}
async function tone(ok,valid=()=>true){
 if(!P.sound)return;
 const generation=soundGeneration;
 try{
  audio??=new(window.AudioContext||window.webkitAudioContext)();
  const resumed=audio.resume();
  const url='/games/sqz/assets/audio/'+(ok?'cheer':'boo')+'.mp3';
  if(!crowdBuffers.has(url))crowdBuffers.set(url,fetch(url).then(r=>{if(!r.ok)throw new Error('Audio unavailable');return r.arrayBuffer();}).then(bytes=>audio.decodeAudioData(bytes)).catch(e=>{crowdBuffers.delete(url);throw e;}));
  const [buffer]=await Promise.all([crowdBuffers.get(url),resumed]);
  if(!P.sound||!valid()||generation!==soundGeneration)return;
  const source=audio.createBufferSource(),gain=audio.createGain();
  source.buffer=buffer;gain.gain.setValueAtTime(.65,audio.currentTime);
  source.connect(gain).connect(audio.destination);
  soundNodes.add(source);
  source.onended=()=>{soundNodes.delete(source);source.disconnect();gain.disconnect();};
  source.start();
 }catch(e){if(generation!==soundGeneration||!P.sound||!valid())return;P.sound=false;updateSound();save();notify('音を再生できないため、音なしで続けます。');}
}

function stages(d){const c=cup(d);return `<div class="stage">${STAGES.map((s,i)=>`<div class="${i===c.stage?'active':''}">${i<c.stage?'✓ ':''}${s}<small>${TARGET[i]}/10問で突破</small></div>`).join('')}</div>`;}
function setup(){const c=cup(diff);set(`<section class="screen"><div class="viewtop"><h2>クイズ王カップ</h2>${button('back','戻る','linkbtn')}</div><p>1問20秒、各ラウンド10問。<br>最後の問題まで、あきらめずに挑もう。</p><div class="difficulty">${[1,2,3].map(d=>`<button data-diff="${d}" class="${d===diff?'selected':''}" aria-pressed="${d===diff}">${DIFF[d]}<small>${['','基本から挑戦','記録にも挑戦','細かな記録へ'][d]}</small></button>`).join('')}</div>${stages(diff)}<div class="card"><p><strong>${DIFF[diff]}・${STAGES[c.stage]}からスタート</strong></p><p class="muted">正解でゴール！ 3問連続正解でハットトリック。<br>途中で中断しても、この端末から再開できます。</p></div><label class="check"><input type="checkbox" id="flags" ${P.flags?'checked':''}>国旗問題を出す（国旗が文字に見える端末ではOFF）</label>${button('start',`${STAGES[c.stage]}に挑む`,'primary green')}<p class="muted center space">難易度は問題の内容で調整。制限時間は共通です。</p></section>`,'setup');document.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{diff=+b.dataset.diff;setup();});$('#flags').onchange=e=>{P.flags=e.target.checked;save();};bind('start',()=>start('cup'));bind('back',home);}
function training(){if(S&&!S.done){dialog('途中のラウンドがあります','先に「途中から再開」から続けるか、記録画面で途中ラウンドを終了してください。');return;}set(`<section class="screen"><div class="viewtop"><h2>トレーニング</h2>${button('back','戻る','linkbtn')}</div><p>時間制限なしで10問。<br>気になるジャンルを、じっくり覚えよう。</p><div class="difficulty">${[1,2,3].map(d=>`<button data-diff="${d}" class="${d===diff?'selected':''}">${DIFF[d]}</button>`).join('')}</div><div class="categories">${[['all','全部ミックス'],...Object.entries(CATS).filter(([k])=>BANK.some(q=>q.category===k))].map(([k,n])=>`<button data-cat="${k}" class="${category===k?'selected':''}">${n}<small>${BANK.filter(q=>q.level<=diff&&(k==='all'||q.category===k)).length}問から出題</small></button>`).join('')}</div><label class="check"><input type="checkbox" id="flags" ${P.flags?'checked':''}>国旗問題を出す</label><div class="menu space">${button('start','練習スタート','primary green')}${button('review',`間違えた問題を復習（${P.mistakes.length}問）`,'secondary',!P.mistakes.length)}</div><p class="muted center space">問題が10問未満のときは、ある問題だけで練習します。</p></section>`,'training');document.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{diff=+b.dataset.diff;training();});document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;training();});$('#flags').onchange=e=>{P.flags=e.target.checked;save();};bind('start',()=>start('training'));bind('review',()=>start('review'));bind('back',home);}
function start(kind){const c=cup(diff),ids=selectQuestions(diff,kind==='training'?category:'all',kind==='cup'?c.used:[],kind==='review');if(!ids.length||(kind==='cup'&&ids.length<10)){dialog('出題できる問題が足りません','国旗問題をONにするか、別の難易度・ジャンルを選んでください。');return;}S={kind,diff,stage:kind==='cup'?c.stage:0,ids,i:0,picks:[],ms:20000,done:false,applied:false,order:{}};save();question();}
function current(){return MAP.get(S.ids[S.i]);}
function correctCount(){return S.picks.reduce((n,a,i)=>n+(a===MAP.get(S.ids[i]).answer?1:0),0);}
function streak(){let n=0;for(let i=S.picks.length-1;i>=0;i--){if(S.picks[i]!==MAP.get(S.ids[i]).answer)break;n++;}return n;}
function completedAnswer(){return S.picks.length>S.i;}
function scoreboard(){return `<div class="scoreboard"><div><small>${S.kind==='cup'?DIFF[S.diff]+'・'+STAGES[S.stage]:S.kind==='review'?'間違えた問題の復習':'トレーニング'}</small><strong>${S.i+1}<small> / ${S.ids.length} 問</small></strong></div><div><small>正解</small><strong>${correctCount()}<small> GOALS</small></strong></div><div><small>残り時間</small><strong id="seconds">${S.kind==='cup'?Math.ceil(S.ms/1000):'∞'}</strong></div></div>`;}
function questionContent(q,options,answered){return `<div class="questionmeta"><span>${CATS[q.category]}</span><span>${q.flag?'FLAG QUIZ':esc(q.period)}</span></div><h2 class="question" id="question" data-id="${q.id}">${esc(q.text)}</h2>${q.flag?`<div class="flag" role="img" aria-label="出題中の国旗">${q.flag}</div>`:''}<div class="answers">${options.map((a,i)=>`<button class="answer ${answered?(a===q.answer?'correct':a===S.picks[S.i]?'wrong':''):''}" data-choice="${i}" ${answered?'disabled':''}><span>${answered&&a===q.answer?'✓':answered&&a===S.picks[S.i]?'×':'ABCD'[i]}</span>${esc(a)}</button>`).join('')}</div>`;}
function question(animate=false){
 const q=current(),answered=completedAnswer(),ok=answered&&S.picks[S.i]===q.answer,hat=ok&&streak()%3===0;
 if(!S.order||typeof S.order!=='object')S.order={};
 let options=S.order[q.id];
 if(!Array.isArray(options)||options.length!==4||new Set(options).size!==4||options.some(a=>!q.choices.includes(a)))options=S.order[q.id]=shuffle(q.choices);
 if(!P.seen.includes(q.id))P.seen.push(q.id);
 const pause=`<div class="space">${button('pause','中断してタイトルへ','linkbtn')}</div>`;
 if(answered){
  set(`<section class="screen answer-stage">${scoreboard()}${pitch('answer-pitch')}<div class="shot-controls"><span role="status">${hat?'3問連続正解！ スーパーシュート！':'シュート！'}</span>${button('skip','演出をスキップ','linkbtn')}</div><section class="feedback ${ok?'':'is-wrong'}" role="status" tabindex="-1" hidden><h3>${ok?'○ 正解！ GOAL!':S.picks[S.i]===null?'時間切れ！ SAVE!':'× 不正解　SAVE!'}</h3><p><strong>答え：${esc(q.answer)}</strong></p><p>${esc(q.explanation)}</p><details><summary>出典と確認日</summary><a href="${esc(q.source)}" target="_blank" rel="noopener noreferrer">公式の記録・資料を開く ↗</a><br>対象：${esc(q.period)}<br>確認日：${q.checkedAt}</details>${button('next',S.i===S.ids.length-1?'結果を見る':'次の問題へ','primary')}</section><details class="review-question" hidden><summary>問題・選択肢を見返す</summary>${questionContent(q,options,true)}</details>${pause}</section>`,'question');
  const stage=$('.answer-stage'),feedback=$('.feedback');
  const controller=window.SQZShot.create($('.answer-pitch'),{ok,superShot:hat,side:S.i%2===0?'right':'left',onComplete(){
   if(!stage.isConnected)return;
   stage.classList.add('is-feedback');feedback.hidden=false;$('.review-question').hidden=false;
   feedback.focus({preventScroll:true});window.scrollTo(0,0);
  }});
  shot=controller;
  bind('skip',()=>{silence();controller.skip();});
  bind('next',()=>{
   if(!completedAnswer()||controller.active)return;
   if(S.i===S.ids.length-1){S.done=true;save();result();}
   else{S.i++;S.ms=20000;save();question();}
  });
  if(animate){
   // Unlock Web Audio in the tap gesture and play the crowd reaction.
   // Suspended/blocked audio cannot hold the visual sequence indefinitely.
   Promise.race([tone(ok,()=>shot===controller&&controller.active),new Promise(resolve=>setTimeout(resolve,180))]).then(()=>controller.begin());
  }else controller.skip(); // Reload/resume shows the saved answer, without scoring or replay.
 }else{
  set(`<section class="screen">${pitch('questionpitch')}${scoreboard()}<div class="timer" id="timer"><div style="width:${S.kind==='cup'?S.ms/200:100}%"></div></div>${questionContent(q,options,false)}${pause}</section>`,'question');
  document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>answer(options[+b.dataset.choice]));
  if(S.kind==='cup')startTimer();
 }
 bind('pause',()=>{syncTime();stop();save();home();});save();
}
function syncTime(){if(timer&&S&&!completedAnswer()){const now=performance.now();S.ms=Math.max(0,S.ms-(now-lastTick));lastTick=now;}}
function startTimer(){if(document.hidden)return;lastTick=performance.now();lastSave=lastTick;timer=setInterval(()=>{if(view!=='question'||completedAnswer()){stop();return;}syncTime();const seconds=$('#seconds'),bar=$('#timer>div');if(seconds)seconds.textContent=Math.ceil(S.ms/1000);if(bar)bar.style.width=(S.ms/200)+'%';$('#timer')?.classList.toggle('urgent',S.ms<=5000);if(performance.now()-lastSave>1000){save();lastSave=performance.now();}if(S.ms<=0)answer(null);},100);}
function answer(a){if(!S||view!=='question'||completedAnswer())return;syncTime();if(S.kind==='cup'&&S.ms<=0)a=null;stop();const q=current(),ok=a===q.answer;S.picks.push(a);P.total++;if(ok){P.correct++;P.mistakes=P.mistakes.filter(id=>id!==q.id);}else if(!P.mistakes.includes(q.id))P.mistakes.push(q.id);P.bestStreak=Math.max(P.bestStreak,streak());save();question(true);}
function result(){const n=correctCount(),isCup=S.kind==='cup',pass=isCup&&n>=TARGET[S.stage],champ=pass&&S.stage===2,c=cup(S.diff);if(!S.applied){if(pass){c.used=[...new Set([...c.used,...S.ids])];c.scores[S.stage]=n;if(champ){c.wins++;c.best=Math.max(c.best,c.scores.reduce((a,b)=>a+b,0));S.cupTotal=c.scores.reduce((a,b)=>a+b,0);c.stage=0;c.used=[];c.scores=[];}else c.stage=S.stage+1;}S.applied=true;save();}set(`<section class="screen center"><p class="eyebrow">${champ?'CHAMPION!':'ROUND RESULT'}</p>${champ?'<div class="trophy" aria-hidden="true">🏆</div>':''}<h2>${champ?'サッカークイズ王！':pass?STAGES[S.stage]+'突破！':isCup?'もう一度、挑戦！':'練習おつかれさま！'}</h2><div class="resultnum">${n}<small> / ${S.ids.length}</small></div><p>正解数</p>${n===S.ids.length?'<span class="badge">PERFECT！ 全問正解</span>':''}<div class="card space"><p>${champ?`${DIFF[S.diff]}の大会を制覇！ 合計 ${S.cupTotal??c.best}/30問正解。`:pass?`次は${STAGES[S.stage+1]}。${TARGET[S.stage+1]}問以上の正解で突破だ！`:isCup?`突破まであと${TARGET[S.stage]-n}問。${STAGES[S.stage]}から再挑戦できるよ。`:'間違えた問題は、復習からもう一度挑戦できるよ。'}</p></div><div class="menu">${button('again',champ?'もう一度大会に挑む':isCup?(pass?'次のラウンドへ':'このラウンドに再挑戦'):'もう一度練習','primary green')}${button('home','タイトルへ','secondary')}</div></section>`,'result');bind('again',()=>{diff=S.diff;const kind=S.kind;S=null;save();if(isCup){if(champ)setup();else start('cup');}else training();});bind('home',()=>{S=null;save();home();});}
function records(){set(`<section class="screen"><div class="viewtop"><h2>これまでの記録</h2>${button('back','戻る','linkbtn')}</div><div class="stats"><div class="card"><strong>${P.total}</strong><small>答えた問題</small></div><div class="card"><strong>${P.total?Math.round(P.correct/P.total*100):0}%</strong><small>正解率</small></div><div class="card"><strong>${P.bestStreak}</strong><small>最高連続正解</small></div><div class="card"><strong>${P.mistakes.length}</strong><small>復習する問題</small></div></div><div class="card space"><h3>大会の記録</h3>${[1,2,3].map(d=>{const c=cup(d);return `<p>${DIFF[d]}：優勝 ${c.wins}回 ／ 最高 ${c.best}/30</p>`;}).join('')}</div><p class="muted">この端末・ブラウザ内に保存します。別の端末とは同期しません。</p>${S?button('end','途中ラウンドを終了する','secondary'):''}${button('reset','記録をすべて消す','linkbtn space')}</section>`,'records');bind('back',home);bind('end',()=>dialog('途中ラウンドを終了しますか？','回答済みの記録と大会の突破状況は残ります。今のラウンドは初めからになります。',()=>{S=null;save();records();},true));bind('reset',()=>dialog('記録をすべて消しますか？','優勝回数・復習問題・途中データを含め、このゲームの記録だけを消します。元には戻せません。',()=>{P=fresh();S=null;save();updateSound();home();},true));}
let onDialogClose=null,dialogReturnFocus=null;
function dialog(title,text,cb=null,cancel=false){dialogReturnFocus=document.activeElement;$('#dialogTitle').textContent=title;$('#dialogText').innerHTML=`<p>${esc(text)}</p>`+(cancel?button('dialogCancel','キャンセル','secondary space'):'');$('#overlay').hidden=false;onDialogClose=()=>{const fn=cb;$('#overlay').hidden=true;onDialogClose=null;if(fn)fn();else dialogReturnFocus?.focus();};$('#dialogOK').textContent=cancel?'実行する':'OK';$('#dialogOK').onclick=onDialogClose;if(cancel)bind('dialogCancel',()=>{$('#overlay').hidden=true;onDialogClose=null;dialogReturnFocus?.focus();});$('#dialogOK').focus();}
document.addEventListener('keydown',e=>{if($('#overlay').hidden)return;if(e.key==='Tab'){const list=[...$('#overlay').querySelectorAll('button,a')],first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){syncTime();stop();silence();if(shot?.active)shot.skip();save();}else if(view==='question'&&S&&!completedAnswer()&&S.kind==='cup')dialog('クイズを再開','残り時間を止めてあります。準備ができたら再開しよう。',()=>startTimer());});
window.addEventListener('pagehide',()=>{syncTime();stop();silence();if(shot?.active)shot.skip();save();});
window.SQZ=Object.freeze({questions:BANK,selectQuestions,allowed});
updateSound();home();if(loadMessage)notify(loadMessage);
</script></body></html>

 const pause=`<div class="space">${button('pause','中断してタイトルへ','linkbtn')}</div>`;
 if(answered){
  set(`<section class="screen answer-stage">${scoreboard()}${pitch('answer-pitch')}<div class="shot-controls"><span role="status">${hat?'3問連続正解！ スーパーシュート！':'シュート！'}</span>${button('skip','演出をスキップ','linkbtn')}</div><section class="feedback ${ok?'':'is-wrong'}" role="status" tabindex="-1" hidden><h3>${ok?'○ 正解！ GOAL!':S.picks[S.i]===null?'時間切れ！ SAVE!':'× 不正解　SAVE!'}</h3><p><strong>答え：${esc(q.answer)}</strong></p><p>${esc(q.explanation)}</p><details><summary>出典と確認日</summary><a href="${esc(q.source)}" target="_blank" rel="noopener noreferrer">公式の記録・資料を開く ↗</a><br>対象：${esc(q.period)}<br>確認日：${q.checkedAt}</details>${button('next',S.i===S.ids.length-1?'結果を見る':'次の問題へ','primary')}</section><details class="review-question" hidden><summary>問題・選択肢を見返す</summary>${questionContent(q,options,true)}</details>${pause}</section>`,'question');
  const stage=$('.answer-stage'),feedback=$('.feedback');
  const controller=window.SQZShot.create($('.answer-pitch'),{ok,superShot:hat,side:S.i%2===0?'right':'left',onImpact(){tone(ok,()=>shot===controller);},onComplete(){
   if(!stage.isConnected)return;
   stage.classList.add('is-feedback');feedback.hidden=false;$('.review-question').hidden=false;
   feedback.focus({preventScroll:true});window.scrollTo(0,0);
  }});
  shot=controller;
  bind('skip',()=>{silence();controller.skip();});
  bind('next',()=>{
   if(!completedAnswer()||controller.active)return;
   if(S.i===S.ids.length-1){S.done=true;save();result();}
   else{S.i++;S.ms=20000;save();question();}
  });
  if(animate){
   // Unlock/decode in the answer gesture; the animation triggers playback at contact.
   const ready=P.sound?prepareCrowd(ok).catch(()=>{}):Promise.resolve();
   Promise.race([ready,new Promise(resolve=>setTimeout(resolve,180))]).then(()=>controller.begin());
  }else controller.skip(); // Reload/resume shows the saved answer, without scoring or replay.
 }else{
  set(`<section class="screen">${pitch('questionpitch')}${scoreboard()}<div class="timer" id="timer"><div style="width:${S.kind==='cup'?S.ms/200:100}%"></div></div>${readingControls()}${questionContent(q,options,false)}${pause}</section>`,'question');
  document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>answer(options[+b.dataset.choice]));
  bindReading();
  if(S.kind==='cup')startTimer();
 }
 bind('pause',()=>{syncTime();stop();save();home();});save();
}
function syncTime(){if(timer&&S&&!completedAnswer()){const now=performance.now();S.ms=Math.max(0,S.ms-(now-lastTick));lastTick=now;}}
function startTimer(){if(document.hidden)return;lastTick=performance.now();lastSave=lastTick;timer=setInterval(()=>{if(view!=='question'||completedAnswer()){stop();return;}syncTime();const seconds=$('#seconds'),bar=$('#timer>div');if(seconds)seconds.textContent=Math.ceil(S.ms/1000);if(bar)bar.style.width=(S.ms/200)+'%';$('#timer')?.classList.toggle('urgent',S.ms<=5000);if(performance.now()-lastSave>1000){save();lastSave=performance.now();}if(S.ms<=0)answer(null);},100);}
function answer(a){if(!S||view!=='question'||completedAnswer())return;syncTime();if(S.kind==='cup'&&S.ms<=0)a=null;stop();const q=current(),ok=a===q.answer;S.picks.push(a);P.total++;if(ok){P.correct++;P.mistakes=P.mistakes.filter(id=>id!==q.id);}else if(!P.mistakes.includes(q.id))P.mistakes.push(q.id);P.bestStreak=Math.max(P.bestStreak,streak());save();question(true);}
function result(){const n=correctCount(),isCup=S.kind==='cup',pass=isCup&&n>=TARGET[S.stage],champ=pass&&S.stage===2,c=cup(S.diff);if(!S.applied){if(pass){c.used=[...new Set([...c.used,...S.ids])];c.scores[S.stage]=n;if(champ){c.wins++;c.best=Math.max(c.best,c.scores.reduce((a,b)=>a+b,0));S.cupTotal=c.scores.reduce((a,b)=>a+b,0);c.stage=0;c.used=[];c.scores=[];}else c.stage=S.stage+1;}S.applied=true;save();}set(`<section class="screen center"><p class="eyebrow">${champ?'CHAMPION!':'ROUND RESULT'}</p>${champ?'<div class="trophy" aria-hidden="true">🏆</div>':''}<h2>${champ?'サッカークイズ王！':pass?STAGES[S.stage]+'突破！':isCup?'もう一度、挑戦！':'練習おつかれさま！'}</h2><div class="resultnum">${n}<small> / ${S.ids.length}</small></div><p>正解数</p>${n===S.ids.length?'<span class="badge">PERFECT！ 全問正解</span>':''}<div class="card space"><p>${champ?`${DIFF[S.diff]}の大会を制覇！ 合計 ${S.cupTotal??c.best}/30問正解。`:pass?`次は${STAGES[S.stage+1]}。${TARGET[S.stage+1]}問以上の正解で突破だ！`:isCup?`突破まであと${TARGET[S.stage]-n}問。${STAGES[S.stage]}から再挑戦できるよ。`:'間違えた問題は、復習からもう一度挑戦できるよ。'}</p></div><div class="menu">${button('again',champ?'もう一度大会に挑む':isCup?(pass?'次のラウンドへ':'このラウンドに再挑戦'):'もう一度練習','primary green')}${button('home','タイトルへ','secondary')}</div></section>`,'result');bind('again',()=>{diff=S.diff;const kind=S.kind;S=null;save();if(isCup){if(champ)setup();else start('cup');}else training();});bind('home',()=>{S=null;save();home();});}
function records(){set(`<section class="screen"><div class="viewtop"><h2>これまでの記録</h2>${button('back','戻る','linkbtn')}</div><div class="stats"><div class="card"><strong>${P.total}</strong><small>答えた問題</small></div><div class="card"><strong>${P.total?Math.round(P.correct/P.total*100):0}%</strong><small>正解率</small></div><div class="card"><strong>${P.bestStreak}</strong><small>最高連続正解</small></div><div class="card"><strong>${P.mistakes.length}</strong><small>復習する問題</small></div></div><div class="card space"><h3>大会の記録</h3>${[1,2,3].map(d=>{const c=cup(d);return `<p>${DIFF[d]}：優勝 ${c.wins}回 ／ 最高 ${c.best}/30</p>`;}).join('')}</div><p class="muted">この端末・ブラウザ内に保存します。別の端末とは同期しません。</p>${S?button('end','途中ラウンドを終了する','secondary'):''}${button('reset','記録をすべて消す','linkbtn space')}</section>`,'records');bind('back',home);bind('end',()=>dialog('途中ラウンドを終了しますか？','回答済みの記録と大会の突破状況は残ります。今のラウンドは初めからになります。',()=>{S=null;save();records();},true));bind('reset',()=>dialog('記録をすべて消しますか？','優勝回数・復習問題・途中データを含め、このゲームの記録だけを消します。元には戻せません。',()=>{P=fresh();S=null;save();updateSound();home();},true));}
let onDialogClose=null,dialogReturnFocus=null;
function dialog(title,text,cb=null,cancel=false){dialogReturnFocus=document.activeElement;$('#dialogTitle').textContent=title;$('#dialogText').innerHTML=`<p>${esc(text)}</p>`+(cancel?button('dialogCancel','キャンセル','secondary space'):'');$('#overlay').hidden=false;onDialogClose=()=>{const fn=cb;$('#overlay').hidden=true;onDialogClose=null;if(fn)fn();else dialogReturnFocus?.focus();};$('#dialogOK').textContent=cancel?'実行する':'OK';$('#dialogOK').onclick=onDialogClose;if(cancel)bind('dialogCancel',()=>{$('#overlay').hidden=true;onDialogClose=null;dialogReturnFocus?.focus();});$('#dialogOK').focus();}
document.addEventListener('keydown',e=>{if($('#overlay').hidden)return;if(e.key==='Tab'){const list=[...$('#overlay').querySelectorAll('button,a')],first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopReading();syncTime();stop();silence();if(shot?.active)shot.skip();save();}else if(view==='question'&&S&&!completedAnswer()&&S.kind==='cup')dialog('クイズを再開','残り時間を止めてあります。準備ができたら再開しよう。',()=>startTimer());});
window.addEventListener('pagehide',()=>{stopReading();syncTime();stop();silence();if(shot?.active)shot.skip();save();});
window.SQZ=Object.freeze({questions:BANK,selectQuestions,allowed});
updateSound();home();if(loadMessage)notify(loadMessage);
</script></body></html>

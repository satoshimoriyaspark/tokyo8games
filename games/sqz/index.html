{"id":"pack500-rules-035","category":"rules","level":1,"text":"主将を示すために着けるものは？","answer":"キャプテンアームバンド","choices":["キャプテンアームバンド","金色の手袋","専用のヘルメット","背中の旗"],"explanation":"主将は識別できるアームバンドを着用するよ。","source":"https://www.theifab.com/laws/latest/the-players/","period":"競技規則2026/27・11人制","checkedAt":"2026-10-15","status":"verified","flag":null},
{"id":"pack500-rules-036","category":"rules","level":2,"text":"ハーフタイムの休憩は、競技規則上何分を超えてはいけない？","answer":"15分","choices":["15分","5分","30分","45分"],"explanation":"大会規定で定める休憩は15分以内だよ。","source":"https://www.theifab.com/laws/latest/the-duration-of-the-match/","period":"競技規則2026/27・11人制","checkedAt":"2026-10-15","status":"verified","flag":null},
{"id":"pack500-rules-037","category":"rules","level":2,"text":"キックオフのボールを最初に蹴る方向は？","answer":"どの方向でもよい","choices":["どの方向でもよい","前方だけ","後方だけ","真横だけ"],"explanation":"蹴られて明らかに動けばインプレーになるよ。","source":"https://www.theifab.com/laws/latest/the-start-and-restart-of-play/","period":"競技規則2026/27・11人制","checkedAt":"2026-10-15","status":"verified","flag":null},
{"id":"pack500-rules-038","category":"rules","level":2,"text":"キックオフから直接相手ゴールに入ったら？","answer":"得点になる","choices":["得点になる","必ずやり直し","相手のスローイン","得点にならずゴールキック"],"explanation":"キックオフは直接相手ゴールへ得点できるよ。","source":"https://www.theifab.com/laws/latest/the-start-and-restart-of-play/","period":"競技規則2026/27・11人制","checkedAt":"2026-10-15","status":"verified","flag":null},
{"id":"pack500-rules-039","category":"rules","level":1,"text":"オフサイドポジションにいるだけで反則になる？","answer":"いるだけでは反則にならない","choices":["いるだけでは反則にならない","必ず反則になる","必ず警告される","必ず退場になる"],"explanation":"ボールや相手への関与などがあって反則になるよ。","source":"https://www.theifab.com/laws/latest/offside/","period":"競技規則2026/27・11人制","checkedAt":"2026-10-15","status":"verified","flag":null},
{"id":"pack500-rules-040","category":"rules","level":2,"text":"オフサイドの位置の判定で数えない体の部分は？","answer":"手と腕","choices":["手と腕","頭","胴体","足"],"explanation":"GKを含め、手と腕はオフサイドの位置判定に使わないよ。","source":"https://www.theifab.com/laws/latest/offside/","period":"競技規則2026/27・11人制","checkedAt":"2026-10-15","status":"verified","flag":null},
{"id":"pack500-rules-041","category":"rules","level":2,"text":"味方が蹴った瞬間、自陣内にいる選手の位置は？","answer":"オフサイドポジションではない","choices":["オフサイドポジションではない","常にオフサイド","GKより前なら必ずオフサイド","タッチライン近くならオフサイド"],"explanation":"オフサイドポジションになるには相手陣内にいる必要があるよ。","source":"https://www.theifab.com/laws/latest/offside/","period":"競技規則2026/27・11人制","checkedAt":"2026-10-15","status":"verified","flag":null},
{"id":"pack500-rules-042","category":"rules","level":2,"text":"後方から2人目の相手と同じ位置にいる選手は？","answer":"その相手より前とは判定しない","choices":["その相手より前とは判定しない","必ずオフサイド","必ず警告","必ず退場"],"explanation":"同じ位置なら、その相手よりゴールラインに近いとは扱わないよ。","source":"https://www.theifab.com/laws/latest/offside/","period":"競技規則2026/27・11人制","checkedAt":"2026-10-15","status":"verified","flag":null},
{"id":"pack500-rules-043","category":"rules","level":2,"text":"間接フリーキックを示す主審の動作は？","answer":"片腕を頭上に上げる","choices":["片腕を頭上に上げる","両手を腰に置く","背中を向ける","片足を上げる"],"explanation":"主審が腕を上げて、間接フリーキックであることを示すよ。","source":"https://www.theifab.com/laws/latest/free-kicks/","period":"競技規則2026/27・11人制","checkedAt":"2026-10-15","status":"verified","flag":null},
{"id":"pack500-rules-044","category":"rules","level":2,"text":"フリーキックを蹴る前のボールはどうする？","answer":"静止させる","choices":["静止させる","必ず転がす","手で持つ","必ず空中に浮かせる"],"explanation":"再開のキックは静止したボールから行うよ。","source":"https://www.theifab.com/laws/latest/free-kicks/","period":"競技規則2026/27・11人制","checkedAt":"2026-10-15","status":"verified","flag":null},
{"id":"pack500-rules-045","category":"rules","level":3,"text":"通常、相手はフリーキックのボールから最低何m離れる？","answer":"9.15m","choices":["9.15m","3m","5m","15m"],"explanation":"原則9.15m。自陣ゴールライン上などの例外があるよ。","source":"https://www.theifab.com/laws/latest/free-kicks/","period":"競技規則2026/27・11人制","checkedAt":"2026-10-15","status":"verified","flag":null},
{"id":"pack500-rules-046","category":"rules","level":2,"text":"PKで、キッカーと守備側GK以外の選手はどこで待つ？","answer":"ペナルティーエリアの外","choices":["ペナルティーエリアの外","ゴールエリアの中","ゴールのすぐ後ろ","キッカーの前ならどこでもよい"],"explanation":"エリア外かつマークより後方で、9.15m以上離れて待つよ。","source":"https://www.theifab.com/laws/latest/the-penalty-kick/","period":"競技規則2026/27・11人制","checkedAt":"2026-10-15","status":"verified","flag":null},
{"id":"pack500-rules-047","category":"rules","level":2,"text":"スローインの瞬間、両足はどうする？","answer":"各足の一部をライン上か外側の地面に着ける","choices":["各足の一部をライン上か外側の地面に着ける","両足を完全に浮かせる","片足だけ必ずエリア内に入れる","両足をゴールライン上に置く"],"explanation":"両足の一部が接地していることが必要だよ。","source":"https://www.theifab.com/laws/latest/the-throw-in/","period":"競技規則2026/27・11人制","checkedAt":"2026-10-15","status":"verified","flag":null},
{"id":"pack500-rules-048","category":"rules","level":3,"text":"スローインをする位置から相手が離れる最低距離は？","answer":"2m","choices":["2m","50cm","5m","9.15m"],"explanation":"相手は投げ入れる地点から少なくとも2m離れるよ。","source":"https://www.theifab.com/laws/latest/the-throw-in/","period":"競技規則2026/27・11人制","checkedAt":"2026-10-15","status":"verified","flag":null},
{"id":"pack500-rules-049","category":"rules","level":1,"text":"ゴールキックを蹴れるのは？","answer":"守備側のどの選手でもよい","choices":["守備側のどの選手でもよい","GKだけ","主将だけ","直前にシュートした選手だけ"],"explanation":"ゴールキーパー以外の味方が蹴ってもよいよ。","source":"https://www.theifab.com/laws/latest/the-goal-kick/","period":"競技規則2026/27・11人制","checkedAt":"2026-10-15","status":"verified","flag":null},
{"id":"pack500-rules-050","category":"rules","level":2,"text":"ゴールキックのボールを置ける場所は？","answer":"ゴールエリア内のどこでも","choices":["ゴールエリア内のどこでも","センターサークル内","コーナーエリア内","タッチライン上だけ"],"explanation":"ゴールエリアの中から蹴って再開するよ。","source":"https://www.theifab.com/laws/latest/the-goal-kick/","period":"競技規則2026/27・11人制","checkedAt":"2026-10-15","status":"verified","flag":null},
{"id":"pack500-rules-051","category":"rules","level":2,"text":"ゴールキックでボールがインプレーになるのは？","answer":"蹴られて明らかに動いたとき","choices":["蹴られて明らかに動いたとき","エリアの外に出たときだけ","味方が触ったときだけ","ハーフウェーラインを越えたとき"],"explanation":"ペナルティーエリアを出るまで待つ必要はないよ。","source":"https://www.theifab.com/laws/latest/the-goal-kick/","period":"競技規則2026/27・11人制","checkedAt":"2026-10-15","status":"verified","flag":null},
{"id":"pack500-rules-052","category":"rules","level":1,"text":"コーナーキックのために邪魔なコーナーフラッグを動かせる？","answer":"動かせない","choices":["動かせない","必ず抜く","主将なら動かせる","蹴る人なら抜ける"],"explanation":"コーナーフラッグは取り外せないよ。","source":"https://www.theifab.com/laws/latest/the-corner-kick/","period":"競技規則2026/27・11人制","checkedAt":"2026-10-15","status":"verified","flag":null},

{"id":"pack500-rules-054","category":"rules","level":3,"text":"通常の11人制で使うボールの円周は？","answer":"68〜70cm","choices":["68〜70cm","40〜42cm","80〜82cm","100〜102cm"],"explanation":"ボールの円周は68cm以上70cm以下だよ。","source":"https://www.theifab.com/laws/latest/the-ball/","period":"競技規則2026/27・11人制","checkedAt":"2026-10-15","status":"verified","flag":null},

   // Unlock/decode in the answer gesture; the animation triggers playback at contact.
   const ready=P.sound?prepareCrowd(ok).catch(()=>{}):Promise.resolve();
   Promise.race([ready,new Promise(resolve=>setTimeout(resolve,180))]).then(()=>controller.begin());
  }else controller.skip(); // Reload/resume shows the saved answer, without scoring or replay.
 }else{
  set(`<section class="screen">${pitch('questionpitch')}${scoreboard()}<div class="timer" id="timer"><div style="width:${S.kind==='cup'?S.ms/200:100}%"></div></div>${readingControls()}${questionContent(q,options,false)}${pause}</section>`,'question');
  document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>answer(options[+b.dataset.choice]));
  bindReading();
  if(S.kind==='cup')startTimer();
 }
 bind('pause',()=>{syncTime();stop();save();home();});bind('top',()=>returnToTop());save();
}
function syncTime(){if(timer&&S&&!completedAnswer()){const now=performance.now();S.ms=Math.max(0,S.ms-(now-lastTick));lastTick=now;}}
function startTimer(){if(document.hidden)return;lastTick=performance.now();lastSave=lastTick;timer=setInterval(()=>{if(view!=='question'||completedAnswer()){stop();return;}syncTime();const seconds=$('#seconds'),bar=$('#timer>div');if(seconds)seconds.textContent=Math.ceil(S.ms/1000);if(bar)bar.style.width=(S.ms/200)+'%';$('#timer')?.classList.toggle('urgent',S.ms<=5000);if(performance.now()-lastSave>1000){save();lastSave=performance.now();}if(S.ms<=0)answer(null);},100);}
function answer(a){if(!S||view!=='question'||completedAnswer())return;syncTime();if(S.kind==='cup'&&S.ms<=0)a=null;stop();const q=current(),ok=a===q.answer;S.picks.push(a);P.total++;if(ok){P.correct++;P.mistakes=P.mistakes.filter(id=>id!==q.id);}else if(!P.mistakes.includes(q.id))P.mistakes.push(q.id);P.bestStreak=Math.max(P.bestStreak,streak());save();question(true);}
function result(){const n=correctCount(),isCup=S.kind==='cup',pass=isCup&&n>=TARGET[S.stage],champ=pass&&S.stage===2,c=cup(S.diff);if(!S.applied){if(pass){c.used=[...new Set([...c.used,...S.ids])];c.scores[S.stage]=n;if(champ){c.wins++;c.best=Math.max(c.best,c.scores.reduce((a,b)=>a+b,0));S.cupTotal=c.scores.reduce((a,b)=>a+b,0);c.stage=0;c.used=[];c.scores=[];}else c.stage=S.stage+1;}S.applied=true;save();}set(`<section class="screen center"><p class="eyebrow">${champ?'CHAMPION!':'ROUND RESULT'}</p>${champ?'<div class="trophy" aria-hidden="true">🏆</div>':''}<h2>${champ?'サッカークイズ王！':pass?STAGES[S.stage]+'突破！':isCup?'もう一度、挑戦！':'練習おつかれさま！'}</h2><div class="resultnum">${n}<small> / ${S.ids.length}</small></div><p>正解数</p>${n===S.ids.length?'<span class="badge">PERFECT！ 全問正解</span>':''}<div class="card space"><p>${champ?`${DIFF[S.diff]}の大会を制覇！ 合計 ${S.cupTotal??c.best}/30問正解。`:pass?`次は${STAGES[S.stage+1]}。${TARGET[S.stage+1]}問以上の正解で突破だ！`:isCup?`突破まであと${TARGET[S.stage]-n}問。${STAGES[S.stage]}から再挑戦できるよ。`:'間違えた問題は、復習からもう一度挑戦できるよ。'}</p></div><div class="menu">${button('again',champ?'もう一度大会に挑む':isCup?(pass?'次のラウンドへ':'このラウンドに再挑戦'):'もう一度練習','primary green')}${button('home','タイトルへ','secondary')}</div></section>`,'result');bind('again',()=>{diff=S.diff;const kind=S.kind;S=null;save();if(isCup){if(champ)setup();else start('cup');}else training();});bind('home',()=>{S=null;save();home();});}
function records(){set(`<section class="screen"><div class="viewtop"><h2>これまでの記録</h2>${button('back','戻る','linkbtn')}</div><div class="stats"><div class="card"><strong>${P.total}</strong><small>答えた問題</small></div><div class="card"><strong>${P.total?Math.round(P.correct/P.total*100):0}%</strong><small>正解率</small></div><div class="card"><strong>${P.bestStreak}</strong><small>最高連続正解</small></div><div class="card"><strong>${P.mistakes.length}</strong><small>復習する問題</small></div></div><div class="card space"><h3>大会の記録</h3>${[1,2,3].map(d=>{const c=cup(d);return `<p>${DIFF[d]}：優勝 ${c.wins}回 ／ 最高 ${c.best}/30</p>`;}).join('')}</div><p class="muted">この端末・ブラウザ内に保存します。別の端末とは同期しません。</p>${S?button('end','途中ラウンドを終了する','secondary'):''}${button('reset','記録をすべて消す','linkbtn space')}</section>`,'records');bind('back',home);bind('end',()=>dialog('途中ラウンドを終了しますか？','回答済みの記録と大会の突破状況は残ります。今のラウンドは初めからになります。',()=>{S=null;save();records();},true));bind('reset',()=>dialog('記録をすべて消しますか？','優勝回数・復習問題・途中データを含め、このゲームの記録だけを消します。元には戻せません。',()=>{P=fresh();S=null;save();updateSound();home();},true));}
function returnToTop(onCancel=null){
 syncTime();stop();stopReading();silence();if(shot?.active)shot.skip();save();
 const wasQuestion=view==='question';
 dialog('TOPへ戻りますか？','今のラウンドの途中データを破棄して、タイトルへ戻ります。回答済みの記録・大会の突破状況・設定は残ります。',()=>{S=null;save();home();},true,{onCancel:onCancel||(()=>{if(wasQuestion)question();})});
 $('#dialogOK').textContent='途中データを破棄して戻る';
}
function resumeDialog(){dialog('クイズを再開','残り時間を止めてあります。準備ができたら再開しよう。',()=>startTimer(),false,{top:true});$('#dialogOK').textContent='再開する';}
let onDialogClose=null,dialogReturnFocus=null;
function dialog(title,text,cb=null,cancel=false,options={}){dialogReturnFocus=document.activeElement;$('#dialogTitle').textContent=title;$('#dialogText').innerHTML=`<p>${esc(text)}</p>`+(cancel?button('dialogCancel','キャンセル','secondary space'):'')+(options.top?button('dialogTop','TOPへ戻る','secondary space'):'');$('#overlay').hidden=false;onDialogClose=()=>{const fn=cb;$('#overlay').hidden=true;onDialogClose=null;if(fn)fn();else dialogReturnFocus?.focus();};$('#dialogOK').textContent=cancel?'実行する':'OK';$('#dialogOK').onclick=onDialogClose;if(cancel)bind('dialogCancel',()=>{$('#overlay').hidden=true;onDialogClose=null;dialogReturnFocus?.focus();options.onCancel?.();});if(options.top)bind('dialogTop',()=>returnToTop(resumeDialog));$('#dialogOK').focus();}
document.addEventListener('keydown',e=>{if($('#overlay').hidden)return;if(e.key==='Tab'){const list=[...$('#overlay').querySelectorAll('button,a')],first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopReading();syncTime();stop();silence();if(shot?.active)shot.skip();save();}else if(view==='question'&&S&&!completedAnswer()&&S.kind==='cup'&&$('#overlay').hidden)resumeDialog();});
window.addEventListener('pagehide',()=>{stopReading();syncTime();stop();silence();if(shot?.active)shot.skip();save();});
window.SQZ=Object.freeze({questions:BANK,selectQuestions,allowed});
updateSound();home();if(loadMessage)notify(loadMessage);
</script></body></html>

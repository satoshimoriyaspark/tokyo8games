<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>駅伝王への道｜1区試遊版</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101d31;color:white;font-family:system-ui,sans-serif}main{max-width:920px;margin:auto;padding:12px}h1{font-size:22px;margin:8px 0}.sub{font-size:12px;color:#b7cbe1}.hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:10px 0;font-weight:bold}.hud span{background:#243e5d;padding:7px;border-radius:4px}canvas{width:100%;aspect-ratio:16/9;display:block;background:#9bd9f3;image-rendering:pixelated;border:4px solid #344f72}.bar{height:12px;background:#44546a;border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;background:#57d57c;width:100%}.controls{display:flex;gap:12px;margin:14px 0}.controls button{flex:1;font-size:22px;font-weight:bold;color:white;background:#1761bc;border:3px solid #8bbcff;border-radius:6px;padding:24px 0;touch-action:none;user-select:none}.controls button:last-child{background:#b63839;border-color:#f69c9d}button:active{filter:brightness(1.4)}#start{padding:10px 22px;font-weight:bold}#message{min-height:24px;color:#ffe59a}small{color:#aec6e0}#selection{background:#213650;border:2px solid #597494;padding:12px;margin:12px 0;border-radius:6px}#teams{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:10px 0}#teams button{border:2px solid #7388a4;background:#17283e;color:white;padding:7px 2px;font-size:11px;border-radius:4px;cursor:pointer}#teams button.chosen{border:3px solid #ffdb63;background:#385778}#teams .swatch{display:block;width:24px;height:24px;margin:0 auto 5px;border:1px solid #ddd;transform:skew(-18deg)}#selectedName{color:#ffe28a;font-weight:bold}#start:disabled{opacity:.6}</style></head>
<body><main><h1>駅伝王への道 <small>1区・試遊版</small></h1><div class="sub">大手町 → 鶴見｜21.3km｜オリジナル20チームによる駅伝レース</div><section id="selection"><strong>TEAM SELECT｜たすきの色を選択</strong><p class="sub">実在する色の系統を参考にした架空の20チームです。</p><div id="teams"></div><p>選択中：<span id="selectedName">青チーム</span></p></section><div class="hud"><span id="place">現在地 大手町</span><span id="distance">0.0 / 21.3km</span><span id="rank">順位 10 / 20</span><span id="clock">00:00</span></div><canvas id="game" width="320" height="180" aria-label="横スクロール駅伝レース"></canvas><div class="hud"><span>スタミナ <b id="energy">100%</b></span><span>ペース <b id="pace">待機中</b></span></div><div class="bar"><i id="bar"></i></div><div class="controls"><button id="left">LEFT<br>左</button><button id="right">RIGHT<br>右</button></div><button id="start">レース開始 / リスタート</button><p id="message">左右を交互に押すと加速。リズムよく走ろう！</p><small>キーボード：A / L または ← / →。開発用に距離と時間を短縮しています。公式大会とは無関係のオリジナル作品です。</small></main>
<script>
(()=>{'use strict';
const c=document.getElementById('game'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;
const $=id=>document.getElementById(id);
const marks=[{km:0,name:'大手町'},{km:3,name:'増上寺付近'},{km:7,name:'品川'},{km:11,name:'大森'},{km:15,name:'蒲田'},{km:18,name:'六郷橋'},{km:21.3,name:'鶴見中継所'}];
const teamColors=[['赤','#D83232'],['青','#2869D5'],['黄','#EAC42D'],['緑','#2B9857'],['紫','#854CC4'],['橙','#E77D24'],['水色','#5AC6DF'],['紺','#233D79'],['桃','#E785AC'],['白','#F2F2E9'],['黒','#242424'],['臙脂','#8F243B'],['黄緑','#91BC34'],['えんじ×白','#A12F42','#F6F6F6'],['青×白','#2463BA','#F6F6F6'],['緑×白','#248453','#F6F6F6'],['赤×白','#C83737','#F6F6F6'],['紺×黄','#253B73','#F3C94D'],['橙×紺','#E57B24','#263B72'],['紫×白','#7D46AA','#F6F6F6']];let selected=1;const teams=$('teams');function choose(i){selected=i;document.querySelectorAll('#teams button').forEach((b,j)=>{b.classList.toggle('chosen',j===i);b.setAttribute('aria-pressed',j===i?'true':'false')});$('selectedName').textContent=teamColors[i][0]+'チーム';if(!s||!s.active)draw(performance.now())}teamColors.forEach((item,i)=>{let b=document.createElement('button');b.type='button';b.innerHTML='<span class="swatch"></span>'+item[0];b.querySelector('.swatch').style.background=item[2]?'linear-gradient(110deg,'+item[1]+' 0 44%,'+item[2]+' 44% 60%,'+item[1]+' 60%)':item[1];b.addEventListener('click',()=>choose(i));teams.appendChild(b)});let s=null,last=performance.now();choose(1);
function reset(){document.getElementById('selection').style.display='none';s={active:true,done:false,km:0,energy:100,speed:0.42,elapsed:0,lastInput:'',lastTap:-1000,combo:0,ai:Array.from({length:19},(_,i)=>({km:0,speed:0.60+(i%7)*0.033,color:teamColors[i>=selected?i+1:i][1]}))};$('message').textContent='スタート！ 左右交互にタップ！'}
function tap(side){if(!s||!s.active)return;let now=performance.now(),delta=now-s.lastTap;const alternate=s.lastInput!==side; if(alternate&&delta>=105&&delta<=950){s.combo=Math.min(12,s.combo+1);s.speed=Math.min(1.65,s.speed+0.095);s.energy=Math.max(0,s.energy-(delta<210?1.4:0.55));}else{s.combo=0;s.speed=Math.max(.2,s.speed-.035);s.energy=Math.max(0,s.energy-.35)}s.lastInput=side;s.lastTap=now;}
['left','right'].forEach(id=>$(id).addEventListener('pointerdown',e=>{e.preventDefault();tap(id)}));
document.addEventListener('keydown',e=>{if(e.repeat)return;if(['ArrowLeft','a','A'].includes(e.key)){e.preventDefault();tap('left')}if(['ArrowRight','l','L'].includes(e.key)){e.preventDefault();tap('right')}});
$('start').addEventListener('click',reset);
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function runner(x,y,color,phase){rect(x-3,y-17,7,7,'#e9b58c');rect(x-5,y-10,11,9,color);rect(x-2,y-10,3,10,'#fff4cb');rect(x-4,y-1,3,8,'#182d4d');rect(x+3,y-1,3,8,'#182d4d');rect(x-8,y-8,3,7,'#e9b58c');rect(x+7,y-8,3,7,'#e9b58c');if(phase){rect(x-7,y+6,5,3,'#f9f9f9')}else{rect(x+3,y+6,5,3,'#f9f9f9')}}
function draw(t){rect(0,0,320,180,'#9bdaf0');rect(0,88,320,92,'#80bd77');let scroll=s?s.km*260:0;for(let i=-1;i<13;i++){let x=i*38-(scroll%38);rect(x,44,23,51,i%3?'#d5dce5':'#f1d2a7');for(let j=0;j<3;j++)rect(x+5,52+j*13,5,7,'#638ba9');}rect(0,112,320,68,'#777b83');rect(0,141,320,3,'#f6edc1');for(let i=0;i<13;i++)rect(i*34-(scroll%34),164,18,2,'#e7e2ce');let m=marks[0];if(s)for(const mark of marks)if(s.km>=mark.km)m=mark;rect(6,6,122,19,'#1c3658');ctx.fillStyle='white';ctx.font='10px monospace';ctx.fillText(m.name,12,19);if(s){let sorted=s.ai.slice().sort((a,b)=>Math.abs(a.km-s.km)-Math.abs(b.km-s.km)).slice(0,5);sorted.forEach((a,i)=>{let x=160+(a.km-s.km)*95;if(x>-10&&x<330)runner(x,126+i*7,a.color,Math.floor(t/170+i)%2)});runner(116,144,teamColors[selected][1],Math.floor(t/150)%2);rect(108,122,18,3,'#fce056');}else runner(116,144,teamColors[selected][1],0);rect(0,176,320,4,'#253b59');rect(0,176,320*(s?Math.min(1,s.km/21.3):0),4,'#f5cf44');}
function frame(t){let dt=Math.min(.05,(t-last)/1000);last=t;if(s&&s.active){s.elapsed+=dt;s.speed=Math.max(.16,s.speed-dt*.27);if(t-s.lastTap>900){s.energy=Math.min(100,s.energy+dt*3.0)}let fatigue=.45+.55*s.energy/100;s.km+=s.speed*fatigue*dt*.19;s.ai.forEach(a=>a.km=Math.min(21.3,a.km+a.speed*dt*.19));if(s.km>=21.3){s.km=21.3;s.active=false;s.done=true;$('message').textContent='鶴見中継所に到着！ '+teamColors[selected][0]+'のたすきをつないだ！';document.getElementById('selection').style.display='block';}let rank=1+s.ai.filter(a=>a.km>s.km).length;let current=marks[0];for(let m of marks)if(s.km>=m.km)current=m;$('place').textContent='現在地 '+current.name;$('distance').textContent=s.km.toFixed(1)+' / 21.3km';$('rank').textContent='順位 '+rank+' / 20';$('clock').textContent=String(Math.floor(s.elapsed/60)).padStart(2,'0')+':'+String(Math.floor(s.elapsed%60)).padStart(2,'0');$('energy').textContent=Math.round(s.energy)+'%';$('bar').style.width=s.energy+'%';$('pace').textContent=s.speed>1.15?'スパート':s.speed>.7?'快調':'ゆっくり';}draw(t);requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>

name: Verify Sangokushi production update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-sangokushi-production.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public HTTPS, new title and exact PNG bytes
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, time, urllib.request, struct
          target = 'https://tokyo8games.com/'
          asset = 'assets/games/sangokushi-card-battle/logo.png'
          for attempt in range(18):
            try:
              with urllib.request.urlopen(target, timeout=20) as r:
                assert r.status == 200
                html = r.read().decode('utf-8')
              assert '<h3>三国志大乱闘カードバトル</h3>' in html, 'New name not live yet'
              assert '三国志大富豪' not in html, 'Old name remains'
              assert 'src="/' + asset + '"' in html
              with urllib.request.urlopen(target + asset, timeout=20) as r:
                assert r.status == 200
                assert r.headers.get_content_type() == 'image/png'
                image = r.read()
              sha = hashlib.sha256(image).hexdigest()
              assert sha == 'fb1663877af115b4024f04e8bc28c765e377438a38e7b4023180c02a1f56722f', 'PNG does not match approved source'
              assert struct.unpack('>II', image[16:24]) == (1991, 789)
              assert image[25] == 6, 'Alpha channel missing'
              report = {'public_url': target, 'http_status': 200, 'title': '三国志大乱闘カードバトル', 'old_title_removed': True, 'logo_url': target + asset, 'logo_sha256': sha, 'original_bytes_preserved': True, 'png_size': [1991, 789], 'rgba': True}
              pathlib.Path('verification').mkdir(exist_ok=True)
              pathlib.Path('verification/report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2))
              print(json.dumps(report, ensure_ascii=False))
              break
            except Exception as exc:
              if attempt == 17:
                raise
              print(f'Waiting for public deployment ({attempt + 1}): {type(exc).__name__}')
              time.sleep(5)
          PY
      - name: Check responsive browser rendering
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export CHROME
          npm install --prefix "$RUNNER_TEMP/logo-browser-check" --no-package-lock --no-audit --no-fund playwright-core@1.55.0
          export NODE_PATH="$RUNNER_TEMP/logo-browser-check/node_modules"
          node <<'JS'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({ executablePath: process.env.CHROME, headless: true, args: ['--no-sandbox'] });
            const results = [];
            for (const [name, width, height] of [['desktop', 1440, 1000], ['mobile', 390, 844]]) {
              const page = await browser.newPage({ viewport: { width, height }, deviceScaleFactor: 1 });
              await page.goto('https://tokyo8games.com/', { waitUntil: 'domcontentloaded' });
              const card = page.locator('article:has(.sangoku)');
              await card.scrollIntoViewIfNeeded();
              const image = card.locator('img');
              await image.evaluate(async img => { if (!img.complete) await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; }); await img.decode(); });
              await page.evaluate(() => document.fonts.ready);
              const data = await image.evaluate(img => ({ loaded: img.complete, naturalWidth: img.naturalWidth, naturalHeight: img.naturalHeight, objectFit: getComputedStyle(img).objectFit, displayWidth: img.getBoundingClientRect().width, displayHeight: img.getBoundingClientRect().height }));
              if (!data.loaded || data.naturalWidth !== 1991 || data.naturalHeight !== 789 || data.objectFit !== 'contain') throw new Error('Invalid logo rendering: ' + JSON.stringify(data));
              if ((await card.locator('h3').innerText()) !== '三国志大乱闘カードバトル') throw new Error('Wrong displayed title');
              const overflow = await page.evaluate(() => document.documentElement.scrollWidth > window.innerWidth);
              if (overflow) throw new Error(name + ': horizontal page overflow');
              await card.screenshot({ path: 'verification/' + name + '-card.png', animations: 'disabled' });
              await page.screenshot({ path: 'verification/' + name + '-viewport.png', animations: 'disabled' });
              results.push({ viewport: name, width, height, horizontalOverflow: overflow, logo: data });
              await page.close();
            }
            await browser.close();
            fs.writeFileSync('verification/browser-report.json', JSON.stringify(results, null, 2));
            console.log(JSON.stringify(results));
          })().catch(err => { console.error(err); process.exit(1); });
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sangokushi-production-verification
          path: verification/
          retention-days: 3
          if-no-files-found: error

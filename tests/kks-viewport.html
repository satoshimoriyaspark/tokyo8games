<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KKS 表示検証</title>
<style>body{font:16px system-ui;background:#ddd;margin:16px}button{font:inherit;padding:10px;margin:4px}iframe{display:block;border:1px solid #777;background:white;margin:16px 0}p{max-width:60rem}</style></head>
<body><h1>KKS 表示検証</h1><p>開発用の画面幅チェックです。正式なゲーム公開は <a href="/kks">/kks</a>。このページは端末やSafariの実機テストを代替しません。</p>
<button data-w="1440" data-h="900">PC 1440 × 900</button><button data-w="390" data-h="844">iPhone相当 390 × 844</button><button data-w="820" data-h="1180">iPad相当 820 × 1180</button><button data-w="1180" data-h="820">iPad横相当 1180 × 820</button>
<p id="size">390 × 844</p><iframe title="KKS検証画面" src="/kks" width="390" height="844"></iframe>
<script>for(const button of document.querySelectorAll('button'))button.onclick=()=>{const frame=document.querySelector('iframe');frame.width=button.dataset.w;frame.height=button.dataset.h;document.querySelector('#size').textContent=frame.width+' × '+frame.height}</script>
</body></html>
